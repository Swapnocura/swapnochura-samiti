<body>
<header class="top"><div class="brand-lockup"><img class="brand-logo" src="./logo.png" alt="স্বপ্নচূড়া লোগো" onerror="this.style.display='none'"><div class="brand-heading"><h1>স্বপ্নচূড়া পণ্য ঋণ বিতরণ সমিতি</h1><small>Admin Panel · MVP</small></div></div><button id="langToggle" class="secondary" type="button">English</button><div id="userbar" class="hidden"><span id="who"></span> <button id="logout" class="secondary">লগআউট</button></div></header>
<main class="wrap">
<section id="loginBox" class="login"><h2>লগইন</h2><p class="small">Admin বা অনুমোদিত কর্মীর ইমেইল ও পাসওয়ার্ড ব্যবহার করুন। এখানে নতুন অ্যাকাউন্ট তৈরি করা যায় না।</p><form id="loginForm"><div class="field"><label>ইমেইল</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>পাসওয়ার্ড</label><input id="password" type="password" autocomplete="current-password" required></div><button type="submit" style="width:100%">লগইন</button></form><div id="loginMsg" class="msg hidden"></div></section>
<section id="appBox" class="hidden">
<div class="app-layout">
<aside id="sidebar" class="sidebar">
<div class="sidebar-head"><button id="menuToggle" class="menu-toggle" type="button" aria-label="মেনু খুলুন বা বন্ধ করুন" title="মেনু খুলুন বা বন্ধ করুন">☰</button><div><div class="sidebar-brand">স্বপ্নচূড়া</div><div class="sidebar-sub">সমিতি ব্যবস্থাপনা</div></div></div>
<nav class="nav" id="nav"></nav>

<div class="main-content"><div id="notice" class="msg hidden"></div><section id="view"></section></div>
</div>
</section>
<div class="foot">প্রাথমিক MVP · বাস্তব সদস্যের আর্থিক তথ্য ব্যবহারের আগে নিরাপত্তা, হিসাব ও অনুমোদন পরীক্ষা করুন।</div>
</main>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, updatePassword, reauthenticateWithCredential, EmailAuthProvider } from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js';
import { getFirestore, doc, getDoc, collection, addDoc, getDocs, query, orderBy, limit, serverTimestamp, runTransaction } from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js';
const firebaseConfig = {
  apiKey: "AIzaSyA4qNbtQDDfXvPbeQGhMUcLDPGG9rIEeGs",
  authDomain: "swapnochura-samiti.firebaseapp.com",
  projectId: "swapnochura-samiti",
  storageBucket: "swapnochura-samiti.firebasestorage.app",
  messagingSenderId: "416130328900",
  appId: "1:416130328900:web:5b2eef0c26e7d2315b4f11"
};
const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);
const $=id=>document.getElementById(id);let currentUser=null, profile=null, currentPage='dashboard';let currentLang='bn';try{currentLang=localStorage.getItem('samitiLang')||'bn'}catch{}let dailySheetDate=dateNow();
const menus=[['dashboard','ড্যাশবোর্ড'],['settings','সেটিংস'],['members','সদস্য ভর্তি / তালিকা'],['passbook','সদস্য পাসবই'],['savingsAccount','নতুন সঞ্চয় হিসাব'],['deposit','সঞ্চয় জমা'],['refund','সঞ্চয় ফেরত'],['products','পণ্য তালিকা'],['purchase','পণ্য ক্রয়'],['sale','পণ্য বিক্রয়'],['loans','ঋণ বিতরণ / তালিকা'],['collection','কিস্তি কালেকশন'],['dailySheet','দৈনিক কালেকশন শিট'],['approvals','অনুমোদন'],['reports','রিপোর্ট']];
const labels={members:'সদস্য',savingsAccounts:'সঞ্চয় হিসাব',savingsTransactions:'সঞ্চয় লেনদেন',refundRequests:'সঞ্চয় ফেরতের আবেদন',products:'পণ্য',purchases:'পণ্য ক্রয়',sales:'পণ্য বিক্রয়',loans:'ঋণ',collections:'কিস্তি কালেকশন',receipts:'রসিদ'};
function safe(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(v){return '৳'+Number(v||0).toLocaleString('en-BD',{maximumFractionDigits:2})}function dateNow(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}function showMsg(el,msg,isError=false){el.textContent=msg;el.classList.remove('hidden');el.classList.toggle('error',isError)}function can(key){return profile?.role==='admin'||profile?.permissions?.[key]===true}
function renderNav(){ $('nav').innerHTML=menus.filter(([k])=>k==='dashboard'||k==='settings'||(k==='dailySheet'?(can('collection')||can('reports')):can(k))).map(([k,t])=>`<button data-page="${k}" data-short="${t.slice(0,1)}" class="${currentPage===k?'active':''}"><span class="nav-label">${t}</span></button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{currentPage=b.dataset.page;renderNav();renderPage()});applyLanguage($('nav'))}
$('menuToggle').addEventListener('click',()=>{$('sidebar').classList.toggle('collapsed')});
function field(name,label,type='text',required=true,opts=null){if(opts)return `<div class="field"><label>${label}</label><select name="${name}" ${required?'required':''}>${opts.map(o=>`<option value="${safe(o[0])}">${safe(o[1])}</option>`).join('')}</select></div>`;const autoName=name==='memberName';return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" ${type==='number'?'min="0" step="0.01"':''} ${autoName?'readonly placeholder="সদস্য নম্বর দিলে নিজে থেকে আসবে"':''} ${required&&!autoName?'required':''}></div>`}
function formBox(title,fields,button='সংরক্ষণ'){return `<div class="panel"><h2>${title}</h2><form class="dataForm">${fields.join('')}<div class="actions"><button>${button}</button></div></form></div>`}
async function saveForm(form,coll,extra={}){const fd=new FormData(form),data={...extra};for(const [k,v] of fd.entries())data[k]=v;if(data.amount!==undefined)data.amount=Number(data.amount);if(data.quantity!==undefined)data.quantity=Number(data.quantity);if(data.price!==undefined)data.price=Number(data.price);if(data.costPrice!==undefined)data.costPrice=Number(data.costPrice);if(data.salePrice!==undefined)data.salePrice=Number(data.salePrice);if(data.installments!==undefined)data.installments=Number(data.installments);if(data.installmentAmount!==undefined)data.installmentAmount=Number(data.installmentAmount);data.createdAt=serverTimestamp();data.createdBy=currentUser.uid;data.createdByEmail=currentUser.email;await addDoc(collection(db,coll),data);return true}
function normalizeDigits(v=''){const s=String(v).replace(/[০-৯]/g,d=>'০১২৩৪৫৬৭৮৯'.indexOf(d)).trim();return /^\d+$/.test(s)?String(Number(s)):s}
function memberDetailText(m){return `সদস্য নম্বর: ${m.memberNo||'—'}\nনাম: ${m.name||'—'}\nমোবাইল: ${m.phone||'—'}\nগ্রাম: ${m.village||'—'}\nঠিকানা: ${m.address||'—'}`}
async function findMemberByNo(memberNo){const target=normalizeDigits(memberNo);if(!target)return null;const snap=await getDocs(collection(db,'members'));return snap.docs.map(d=>({id:d.id,...d.data()})).find(m=>normalizeDigits(m.memberNo)===target)||null}
function setFormValue(form,name,value){const el=form.querySelector(`[name="${name}"]`);if(el&&value!==undefined&&value!==null)el.value=String(value)}
async function fillMemberDetails(form,memberNo){const box=form.querySelector('.memberLookupDetails');if(box)box.innerHTML='<span class="small">সদস্য খোঁজা হচ্ছে…</span>';try{const m=await findMemberByNo(memberNo);if(!m){if(box)box.innerHTML='<span class="msg error">এই সদস্য নম্বর পাওয়া যায়নি।</span>';setFormValue(form,'memberName','');return null}setFormValue(form,'memberName',m.name||'');setFormValue(form,'name',m.name||'');setFormValue(form,'phone',m.phone||'');setFormValue(form,'village',m.village||'');setFormValue(form,'address',m.address||'');if(box)box.innerHTML=`<div class="msg"><b>সদস্যের তথ্য পাওয়া গেছে</b><br>নাম: ${safe(m.name||'—')}<br>মোবাইল: ${safe(m.phone||'—')}<br>গ্রাম: ${safe(m.village||'—')}<br>ঠিকানা: ${safe(m.address||'—')}</div>`;return m}catch(err){if(box)box.innerHTML=`<span class="msg error">সদস্যের তথ্য আনা যায়নি: ${safe(err.message)}</span>`;return null}}
async function createMember(form){if(profile?.role!=='admin'&&!can('members'))throw new Error('সদস্য তৈরি করার অনুমতি নেই।');const fd=new FormData(form),data=Object.fromEntries(fd.entries());data.name=String(data.name||'').trim();data.phone=String(data.phone||'').trim();data.address=String(data.address||'').trim();if(!data.name||!data.phone||!data.address)throw new Error('সদস্যের নাম, মোবাইল ও ঠিকানা দিন।');const all=await getDocs(collection(db,'members'));let maxNo=0;all.docs.forEach(d=>{const n=parseInt(normalizeDigits(d.data().memberNo||''),10);if(Number.isFinite(n))maxNo=Math.max(maxNo,n)});const counterRef=doc(db,'counters','members'),memberRef=doc(collection(db,'members'));let newNo='';await runTransaction(db,async t=>{const c=await t.get(counterRef);const next=Math.max(c.exists()?Number(c.data().value||0):0,maxNo)+1;newNo=String(next).padStart(2,'0');t.set(counterRef,{value:next,updatedAt:serverTimestamp(),updatedBy:currentUser.uid});t.set(memberRef,{...data,memberNo:newNo,status:'active',createdAt:serverTimestamp(),createdBy:currentUser.uid,createdByEmail:currentUser.email})});return `সদস্য সফলভাবে তৈরি হয়েছে! নতুন সদস্য নম্বর: ${newNo}`}
function makeInvoiceNo(){const d=dateNow().replaceAll('-','');return `SW-${d}-${Math.random().toString(36).slice(2,7).toUpperCase()}`}
async function saveSale(form){const fd=new FormData(form),d=Object.fromEntries(fd.entries());d.memberNo=String(d.memberNo||'').trim();d.memberName=String(d.memberName||'').trim();if(!d.memberNo)throw new Error('সদস্য নম্বর দিন।');const m=await findMemberByNo(d.memberNo);if(!m)throw new Error('সঠিক সদস্য নম্বর দিন।');d.memberName=m.name||d.memberName;d.quantity=Number(d.quantity);d.price=Number(d.price);d.deposit=Number(d.deposit||0);if(d.quantity<=0||d.price<=0)throw new Error('পরিমাণ ও একক মূল্য শূন্যের বেশি হতে হবে।');d.total=d.quantity*d.price;if(d.deposit>d.total)throw new Error('অগ্রিম জমা মোট দামের চেয়ে বেশি হতে পারবে না।');d.balance=d.total-d.deposit;d.invoiceNo=makeInvoiceNo();d.status='recorded';d.createdAt=serverTimestamp();d.createdBy=currentUser.uid;d.createdByEmail=currentUser.email;await addDoc(collection(db,'sales'),d);return `পণ্য বিক্রি সফল হয়েছে। ইনভয়েস নম্বর: ${d.invoiceNo}`}
async function lookupSaleInvoice(form,invoiceNo){const code=String(invoiceNo||'').trim();const box=form.querySelector('.invoiceLookupDetails');if(box)box.innerHTML='<span class="small">ইনভয়েস খোঁজা হচ্ছে…</span>';if(!code)return;try{const snap=await getDocs(collection(db,'sales'));const sale=snap.docs.map(d=>({id:d.id,...d.data()})).find(x=>String(x.invoiceNo||'').toLowerCase()===code.toLowerCase());if(!sale){if(box)box.innerHTML='<div class="msg error">এই ইনভয়েস নম্বর পাওয়া যায়নি।</div>';return}const m=await findMemberByNo(sale.memberNo);setFormValue(form,'memberNo',sale.memberNo||'');setFormValue(form,'memberName',sale.memberName||m?.name||'');setFormValue(form,'productName',sale.productName||'');setFormValue(form,'productCode',sale.productCode||'');setFormValue(form,'totalAmount',sale.total||Number(sale.quantity||0)*Number(sale.price||0));const totalInput=form.querySelector('[name="totalAmount"]');if(totalInput)totalInput.readOnly=true;form.dataset.invoiceTotal=String(sale.total||Number(sale.quantity||0)*Number(sale.price||0));form.dataset.invoiceNo=sale.invoiceNo;const deposit=form.querySelector('[name="deposit"]');if(deposit&&(!deposit.value||Number(deposit.value)===0))deposit.value='0';const used=await getDocs(collection(db,'loans'));const exists=used.docs.some(d=>String(d.data().invoiceNo||'')===String(sale.invoiceNo));if(box)box.innerHTML=`<div class="msg ${exists?'error':''}"><b>${exists?'সতর্কতা: এই ইনভয়েসে আগে ঋণ রেকর্ড আছে':'ইনভয়েস পাওয়া গেছে'}</b><br>ইনভয়েস: ${safe(sale.invoiceNo)}<br>সদস্য নম্বর: ${safe(sale.memberNo||'—')}<br>সদস্য: ${safe(sale.memberName||m?.name||'—')}<br>পণ্য: ${safe(sale.productName||'—')}<br>মোট মূল্য: ${money(sale.total||0)}<br>বিক্রির সময় জমা: ${money(sale.deposit||0)}<br>বিক্রির সময় বাকি: ${money(sale.balance||0)}</div>`;calculateLoanPreview(form)}catch(err){if(box)box.innerHTML=`<div class="msg error">ইনভয়েস আনা যায়নি: ${safe(err.message)}</div>`}}
function calculateLoanPreview(form){const total=Number(form.dataset.invoiceTotal||form.querySelector('[name="principal"]')?.dataset.invoiceTotal||0);const deposit=Number(form.querySelector('[name="deposit"]')?.value||0);const mode=form.querySelector('[name="repaymentMode"]')?.value||'installment';const count=Math.max(1,Number(form.querySelector('[name="installments"]')?.value||1));const principal=Math.max(0,total-deposit);const p=form.querySelector('[name="principal"]');if(p&&form.dataset.invoiceTotal){p.value=principal.toFixed(2);p.readOnly=true}else if(p)p.readOnly=false;const amount=form.querySelector('[name="installmentAmount"]');if(amount)amount.value=mode==='installment'?(principal/count).toFixed(2):principal.toFixed(2);const info=form.querySelector('.loanCalcDetails');if(info)info.innerHTML=`<div class="msg">মোট ইনভয়েস: ${money(total)}<br>জমা: ${money(deposit)}<br><b>ঋণ/বাকি: ${money(principal)}</b><br>${mode==='installment'?'প্রতি '+(form.querySelector('[name="installmentType"]')?.value==='weekly'?'সপ্তাহে':'মাসে')+' কিস্তি: '+money(principal/count):'নগদ পরিশোধ: '+money(principal)}</div>`}
async function saveLoan(form){const fd=new FormData(form),d=Object.fromEntries(fd.entries());d.invoiceNo=String(d.invoiceNo||'').trim();d.memberNo=String(d.memberNo||'').trim();d.memberName=String(d.memberName||'').trim();d.deposit=Number(d.deposit||0);d.principal=Number(d.principal||0);d.totalAmount=Number(d.totalAmount||0);d.installments=Math.max(1,Number(d.installments||1));d.installmentAmount=Number(d.installmentAmount||d.principal/d.installments);if(!d.memberNo)throw new Error('সদস্য নম্বর দিন বা ইনভয়েস দিয়ে সদস্য খুঁজুন।');const m=await findMemberByNo(d.memberNo);if(!m)throw new Error('সদস্য নম্বর সঠিক নয়।');d.memberName=m.name||d.memberName;if(d.totalAmount&&d.deposit>d.totalAmount)throw new Error('জমার পরিমাণ ইনভয়েসের মোট দামের চেয়ে বেশি।');if(d.totalAmount)d.principal=Math.max(0,d.totalAmount-d.deposit);if(d.repaymentMode==='cash')d.installmentAmount=d.principal;else d.installmentAmount=d.principal/d.installments;const allLoans=await getDocs(collection(db,'loans'));if(d.invoiceNo&&allLoans.docs.some(x=>String(x.data().invoiceNo||'')===d.invoiceNo))throw new Error('এই ইনভয়েস দিয়ে আগে ঋণ রেকর্ড করা হয়েছে।');let maxLoanNo=0;allLoans.docs.forEach(x=>{const m=String(x.data().loanNo||'').match(/^LN-(\d+)$/i);if(m)maxLoanNo=Math.max(maxLoanNo,Number(m[1]))});d.status='recorded';d.createdAt=serverTimestamp();d.createdBy=currentUser.uid;d.createdByEmail=currentUser.email;const counterRef=doc(db,'counters','loans'),loanRef=doc(collection(db,'loans'));let newLoanNo='';await runTransaction(db,async t=>{const c=await t.get(counterRef);const next=Math.max(c.exists()?Number(c.data().value||0):0,maxLoanNo)+1;newLoanNo='LN-'+String(next).padStart(4,'0');t.set(counterRef,{value:next,updatedAt:serverTimestamp(),updatedBy:currentUser.uid});t.set(loanRef,{...d,loanNo:newLoanNo})});return `ঋণ রেকর্ড সফলভাবে তৈরি হয়েছে। ঋণ নম্বর: ${newLoanNo}; অবশিষ্ট ঋণ: ${money(d.principal)}; প্রতি কিস্তি: ${money(d.installmentAmount)}`}

async function changePassword(form){const fd=new FormData(form),old=String(fd.get('currentPassword')||''),next=String(fd.get('newPassword')||''),confirm=String(fd.get('confirmPassword')||'');if(next.length<6)throw new Error('নতুন পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।');if(next!==confirm)throw new Error('নতুন পাসওয়ার্ড দুইবার এক হয়নি।');if(!currentUser?.email)throw new Error('এই অ্যাকাউন্টে ইমেইল নেই।');const credential=EmailAuthProvider.credential(currentUser.email,old);await reauthenticateWithCredential(currentUser,credential);await updatePassword(currentUser,next);return 'পাসওয়ার্ড সফলভাবে পরিবর্তন হয়েছে।'}
function balanceId(memberNo){return encodeURIComponent(String(memberNo||'').trim())}
async function calculateLegacyBalance(memberNo){const snap=await getDocs(collection(db,'savingsTransactions'));let total=0;for(const d of snap.docs){const r=d.data();if(String(r.memberNo||'').trim()!==String(memberNo||'').trim()||r.status!=='approved')continue;const a=Number(r.amount||0);if(r.type==='deposit')total+=a;else if(r.type==='refund')total-=a;}return Math.max(0,total)}
async function recordSavingsMovement(raw,type){const data={...raw};data.memberNo=String(data.memberNo||'').trim();data.memberName=String(data.memberName||'').trim();data.amount=Number(data.amount);if(!data.memberNo)throw new Error('সদস্য নম্বর দিন।');if(!Number.isFinite(data.amount)||data.amount<=0)throw new Error('পরিমাণ শূন্যের বেশি হতে হবে।');const seedBalance=await calculateLegacyBalance(data.memberNo);const balanceRef=doc(db,'savingsBalances',balanceId(data.memberNo));const txRef=doc(collection(db,'savingsTransactions'));await runTransaction(db,async t=>{const b=await t.get(balanceRef);const current=b.exists()?Number(b.data().balance||0):seedBalance;if(type==='refund'&&data.amount>current)throw new Error('সঞ্চয় ব্যালেন্স অপর্যাপ্ত। বর্তমান ব্যালেন্স: '+money(current));const next=type==='deposit'?current+data.amount:current-data.amount;t.set(balanceRef,{memberNo:data.memberNo,memberName:data.memberName,balance:next,updatedAt:serverTimestamp(),updatedBy:currentUser.uid});t.set(txRef,{...data,type,status:'approved',createdAt:serverTimestamp(),createdBy:currentUser.uid,createdByEmail:currentUser.email});});return true}
function passbookPage(){return `<div class="panel"><h2>সদস্য পাসবই</h2><p>সদস্য নম্বর বা নাম লিখে সম্পূর্ণ সঞ্চয় লেনদেন ও বর্তমান সঞ্চয় ব্যালেন্স দেখুন।</p><form id="passbookSearch" class="row2"><div class="field"><label>সদস্য নম্বর বা নাম</label><input name="term" required placeholder="যেমন: ০১ অথবা সদস্যের নাম"></div><div class="actions" style="align-items:end"><button type="submit">খুঁজুন</button></div></form><div id="passbookResults"><p class="small">সদস্য খুঁজতে নম্বর বা নাম লিখুন।</p></div></div>`}
async function renderPassbook(term){const out=$('passbookResults');out.innerHTML='<p>খোঁজা হচ্ছে…</p>';const qtext=String(term||'').trim().toLocaleLowerCase('bn');if(!qtext){out.innerHTML='<p class="msg error">সদস্য নম্বর বা নাম লিখুন।</p>';return}const [ms,ts]=await Promise.all([getDocs(collection(db,'members')),getDocs(collection(db,'savingsTransactions'))]);const members=ms.docs.map(d=>({id:d.id,...d.data()}));const txs=ts.docs.map(d=>({id:d.id,...d.data()}));let found=members.filter(m=>String(m.memberNo||'').toLocaleLowerCase('bn').includes(qtext)||String(m.name||'').toLocaleLowerCase('bn').includes(qtext));if(!found.length){const txMembers=new Map();txs.filter(t=>String(t.memberNo||'').toLocaleLowerCase('bn').includes(qtext)||String(t.memberName||'').toLocaleLowerCase('bn').includes(qtext)).forEach(t=>txMembers.set(String(t.memberNo||t.memberName),{memberNo:t.memberNo||'',name:t.memberName||''}));found=[...txMembers.values()]}if(!found.length){out.innerHTML='<p class="msg">এই নামে বা নম্বরে কোনো সদস্য/লেনদেন পাওয়া যায়নি।</p>';return}const exact=found.length===1?found[0]:found.find(m=>String(m.memberNo||'').trim().toLocaleLowerCase('bn')===qtext)||found.find(m=>String(m.name||'').trim().toLocaleLowerCase('bn')===qtext);if(!exact){out.innerHTML='<div class="panel"><h3>একাধিক সদস্য পাওয়া গেছে</h3><p>সঠিক সদস্য নির্বাচন করতে নম্বরসহ অনুসন্ধান করুন:</p><div class="table-wrap"><table><thead><tr><th>সদস্য নম্বর</th><th>নাম</th><th>নির্বাচন</th></tr></thead><tbody>'+found.map(m=>`<tr><td>${safe(m.memberNo||'—')}</td><td>${safe(m.name||m.memberName||'—')}</td><td><button type="button" class="secondary" data-pb-select="${safe(m.memberNo||'')}" data-pb-name="${safe(m.name||m.memberName||'')}">দেখুন</button></td></tr>`).join('')+'</tbody></table></div></div>';out.querySelectorAll('[data-pb-select]').forEach(b=>b.onclick=()=>renderPassbook(b.dataset.pbSelect||b.dataset.pbName));return}const no=String(exact.memberNo||'').trim(),name=String(exact.name||exact.memberName||'').trim();const rows=txs.filter(t=>(no&&String(t.memberNo||'').trim()===no)||(!no&&name&&String(t.memberName||'').trim()===name)).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));let deposits=0,refunds=0;rows.forEach(r=>{if(r.status==='approved'&&r.type==='deposit')deposits+=Number(r.amount||0);if(r.status==='approved'&&r.type==='refund')refunds+=Number(r.amount||0)});out.innerHTML=`<div class="stats"><div class="stat"><span>সদস্য নম্বর</span><strong>${safe(no||'—')}</strong></div><div class="stat"><span>সদস্যের নাম</span><strong>${safe(name||'—')}</strong></div><div class="stat"><span>মোট অনুমোদিত জমা</span><strong>${money(deposits)}</strong></div><div class="stat"><span>মোট অনুমোদিত ফেরত</span><strong>${money(refunds)}</strong></div><div class="stat"><span>বর্তমান হিসাবি ব্যালেন্স</span><strong>${money(Math.max(0,deposits-refunds))}</strong></div></div><div class="panel"><div class="section-head"><h2>লেনদেনের বিবরণ</h2><button class="secondary" type="button" onclick="window.print()">প্রিন্ট</button></div><div class="table-wrap"><table><thead><tr><th>তারিখ</th><th>ধরন</th><th>পরিমাণ</th><th>রসিদ</th><th>অবস্থা</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${safe(r.date||'—')}</td><td>${safe(r.type==='deposit'?'সঞ্চয় জমা':r.type==='refund'?'সঞ্চয় ফেরত':r.type||'—')}</td><td>${money(r.amount)}</td><td>${safe(r.receiptNo||'—')}</td><td>${safe(r.status||'—')}</td></tr>`).join('')||'<tr><td colspan="5">এই সদস্যের কোনো লেনদেন নেই।</td></tr>'}</tbody></table></div></div>`}
async function decideCollection(id,decision){if(profile?.role!=='admin')throw new Error('শুধু Admin কালেকশন অনুমোদন বা প্রত্যাখ্যান করতে পারবেন।');const ref=doc(db,'collections',id);await runTransaction(db,async t=>{const snap=await t.get(ref);if(!snap.exists())throw new Error('কালেকশন রেকর্ড পাওয়া যায়নি।');if(snap.data().status==='approved'||snap.data().status==='rejected')throw new Error('এই কালেকশন ইতিমধ্যে নিষ্পত্তি হয়েছে।');t.update(ref,{status:decision==='approve'?'approved':'rejected',reviewedAt:serverTimestamp(),reviewedBy:currentUser.uid,reviewedByEmail:currentUser.email})});showNotice(decision==='approve'?'কালেকশন অনুমোদিত হয়েছে।':'কালেকশন প্রত্যাখ্যান করা হয়েছে।');await renderPage()}
async function dailyCollectionSheet(date=dateNow()){const [cs,ls]=await Promise.all([getDocs(collection(db,'collections')),getDocs(collection(db,'loans'))]);const all=cs.docs.map(d=>({id:d.id,...d.data()}));const rows=all.filter(r=>String(r.date||'')===date&&r.status!=='rejected').sort((a,b)=>String(a.createdByEmail||'').localeCompare(String(b.createdByEmail||''))||String(a.memberNo||'').localeCompare(String(b.memberNo||'')));const approved=rows.filter(r=>r.status==='approved'),pending=rows.filter(r=>r.status!=='approved');const sum=arr=>arr.reduce((n,r)=>n+Number(r.amount||0),0);const categorySum=(arr,key)=>sum(arr.filter(r=>r.paymentFor===key));const loans=ls.docs.map(d=>({id:d.id,...d.data()}));const memberLoanTotals=new Map(),memberPaidTotals=new Map();loans.forEach(l=>{const no=String(l.memberNo||'');memberLoanTotals.set(no,(memberLoanTotals.get(no)||0)+Number(l.principal||0))});all.filter(r=>r.status==='approved').forEach(r=>{const no=String(r.memberNo||'');memberPaidTotals.set(no,(memberPaidTotals.get(no)||0)+Number(r.amount||0))});let outstanding=0;for(const [no,total] of memberLoanTotals)outstanding+=Math.max(0,total-(memberPaidTotals.get(no)||0));const employeeMap=new Map();rows.forEach(r=>{const key=r.createdByEmail||r.createdBy||'অজানা কর্মী';const obj=employeeMap.get(key)||{name:key,count:0,approved:0,pending:0};obj.count++;if(r.status==='approved')obj.approved+=Number(r.amount||0);else obj.pending+=Number(r.amount||0);employeeMap.set(key,obj)});return `<div class="panel"><div class="section-head"><h2>তারিখভিত্তিক দৈনিক কালেকশন শিট</h2><button type="button" class="secondary" onclick="window.print()">প্রিন্ট / PDF</button></div><form id="dailySheetForm" class="row2"><div class="field"><label>কালেকশনের তারিখ</label><input type="date" name="sheetDate" value="${safe(date)}" required></div><div class="actions" style="align-items:end"><button type="submit">রিপোর্ট দেখুন</button></div></form></div><div id="dailySheetResults"><div class="stats"><div class="stat"><span>মোট জমা দেওয়া আদায়</span><strong>${money(sum(rows))}</strong></div><div class="stat"><span>Admin অনুমোদিত আদায়</span><strong>${money(sum(approved))}</strong></div><div class="stat"><span>অপেক্ষমাণ রিপোর্ট</span><strong>${money(sum(pending))}</strong></div><div class="stat"><span>নগদ ঋণ আদায়</span><strong>${money(categorySum(approved,'cashLoan'))}</strong></div><div class="stat"><span>পণ্য বিক্রয়/ঋণ আদায়</span><strong>${money(categorySum(approved,'productSale')+categorySum(approved,'productLoan'))}</strong></div><div class="stat"><span>আনুমানিক অবশিষ্ট ঋণ</span><strong>${money(outstanding)}</strong></div></div><div class="panel"><h2>কর্মীভিত্তিক সারাংশ</h2><div class="table-wrap"><table><thead><tr><th>কর্মী</th><th>রেকর্ড</th><th>অনুমোদিত আদায়</th><th>অপেক্ষমাণ</th></tr></thead><tbody>${[...employeeMap.values()].map(e=>`<tr><td>${safe(e.name)}</td><td>${e.count}</td><td>${money(e.approved)}</td><td>${money(e.pending)}</td></tr>`).join('')||'<tr><td colspan="4">এই তারিখে কোনো কালেকশন নেই।</td></tr>'}</tbody></table></div></div><div class="panel"><h2>সদস্যভিত্তিক কালেকশন</h2><div class="table-wrap"><table><thead><tr><th>সদস্য নম্বর</th><th>সদস্যের নাম</th><th>ঋণ নম্বর</th><th>কিস্তির পরিমাণ</th><th>আদায়</th><th>ধরন</th><th>কর্মী</th><th>অবস্থা</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${safe(r.memberNo||'—')}</td><td>${safe(r.memberName||'—')}</td><td>${safe(r.loanNo||'—')}</td><td>${money(r.installmentAmount||0)}</td><td>${money(r.amount||0)}</td><td>${safe(({cashLoan:'নগদ ঋণ',productSale:'পণ্য বিক্রয়',productLoan:'পণ্য ঋণ'})[r.paymentFor]||r.paymentFor||'—')}</td><td>${safe(r.createdByEmail||'—')}</td><td>${safe(r.status==='approved'?'অনুমোদিত':r.status==='rejected'?'প্রত্যাখ্যাত':'অপেক্ষমাণ')}</td></tr>`).join('')||'<tr><td colspan="8">এই তারিখে কোনো কালেকশন নেই।</td></tr>'}</tbody></table></div><p class="small">Pending/পুরোনো যাচাই-না-করা রেকর্ডকে অনুমোদিত আদায়ে গণনা করা হয়নি। ব্রাউজারের Print থেকে Save as PDF নির্বাচন করা যাবে।</p></div></div>`}
async function approvalsPage(){const snap=await getDocs(collection(db,'refundRequests'));const rows=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>{const ap=a.status==='pending'?0:1,bp=b.status==='pending'?0:1;return ap-bp||String(b.date||'').localeCompare(String(a.date||''))});return `<div class="panel"><h2>সঞ্চয় ফেরতের অপেক্ষমাণ আবেদন</h2><p>অনুমোদনের সময় সদস্যের অনুমোদিত জমা থেকে অনুমোদিত ফেরত বাদ দিয়ে ব্যালেন্স যাচাই করা হবে। অনুমোদন ও ব্যালেন্স আপডেট একসঙ্গে সংরক্ষিত হবে।</p><div class="table-wrap"><table><thead><tr><th>সদস্য নম্বর</th><th>নাম</th><th>পরিমাণ</th><th>তারিখ</th><th>কারণ</th><th>অবস্থা</th><th>কাজ</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${safe(r.memberNo||'—')}</td><td>${safe(r.memberName||'—')}</td><td>${money(r.amount)}</td><td>${safe(r.date||'—')}</td><td>${safe(r.reason||'—')}</td><td>${safe(r.status||'pending')}</td><td>${r.status==='pending'&&profile?.role==='admin'?`<button type="button" data-refund-action="approve" data-id="${r.id}">অনুমোদন করুন</button> <button type="button" class="danger" data-refund-action="reject" data-id="${r.id}">প্রত্যাখ্যান</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="7">কোনো আবেদন নেই।</td></tr>'}</tbody></table></div></div>`+await pendingCollectionsPanel()}
async function pendingCollectionsPanel(){const snap=await getDocs(collection(db,'collections'));const rows=snap.docs.map(d=>({id:d.id,...d.data()})).filter(r=>!['approved','rejected'].includes(r.status)).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));return `<div class="panel"><h2>কালেকশন অনুমোদন</h2><p>শুধু Admin অপেক্ষমাণ কালেকশন অনুমোদন বা প্রত্যাখ্যান করতে পারবেন।</p><div class="table-wrap"><table><thead><tr><th>তারিখ</th><th>সদস্য নম্বর</th><th>নাম</th><th>আদায়</th><th>কর্মী</th><th>কাজ</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${safe(r.date||'—')}</td><td>${safe(r.memberNo||'—')}</td><td>${safe(r.memberName||'—')}</td><td>${money(r.amount||0)}</td><td>${safe(r.createdByEmail||'—')}</td><td>${profile?.role==='admin'?`<button type="button" data-collection-action="approve" data-id="${r.id}">অনুমোদন করুন</button> <button type="button" class="danger" data-collection-action="reject" data-id="${r.id}">প্রত্যাখ্যান</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="6">কোনো অপেক্ষমাণ কালেকশন নেই।</td></tr>'}</tbody></table></div></div>`}
async function decideRefund(id,decision){if(profile?.role!=='admin')throw new Error('শুধু Admin আবেদন অনুমোদন বা প্রত্যাখ্যান করতে পারবেন।');const requestRef=doc(db,'refundRequests',id);const before=await getDoc(requestRef);if(!before.exists())throw new Error('আবেদনটি পাওয়া যায়নি।');const req=before.data();if(req.status!=='pending')throw new Error('এই আবেদন ইতিমধ্যে নিষ্পত্তি হয়েছে।');if(decision==='reject'){await runTransaction(db,async t=>{const rs=await t.get(requestRef);if(!rs.exists()||rs.data().status!=='pending')throw new Error('আবেদনটি ইতিমধ্যে নিষ্পত্তি হয়েছে।');t.update(requestRef,{status:'rejected',rejectedAt:serverTimestamp(),rejectedBy:currentUser.uid});});showNotice('আবেদন প্রত্যাখ্যান করা হয়েছে।');await renderPage();return}const memberNo=String(req.memberNo||'').trim(),amount=Number(req.amount||0);if(!memberNo)throw new Error('আবেদনে সদস্য নম্বর নেই।');if(!Number.isFinite(amount)||amount<=0)throw new Error('আবেদনের পরিমাণ সঠিক নয়।');const seedBalance=await calculateLegacyBalance(memberNo);const balanceRef=doc(db,'savingsBalances',balanceId(memberNo));const txRef=doc(collection(db,'savingsTransactions'));await runTransaction(db,async t=>{const [rs,bs]=await Promise.all([t.get(requestRef),t.get(balanceRef)]);if(!rs.exists()||rs.data().status!=='pending')throw new Error('আবেদনটি ইতিমধ্যে নিষ্পত্তি হয়েছে।');const current=bs.exists()?Number(bs.data().balance||0):seedBalance;if(amount>current)throw new Error('সঞ্চয় ব্যালেন্স অপর্যাপ্ত। বর্তমান ব্যালেন্স: '+money(current));t.set(balanceRef,{memberNo,memberName:req.memberName||'',balance:current-amount,updatedAt:serverTimestamp(),updatedBy:currentUser.uid});t.set(txRef,{memberNo,memberName:req.memberName||'',amount,type:'refund',date:req.date||dateNow(),reason:req.reason||'',receiptNo:req.receiptNo||'',status:'approved',refundRequestId:id,createdAt:serverTimestamp(),createdBy:currentUser.uid,createdByEmail:currentUser.email});t.update(requestRef,{status:'approved',approvedAt:serverTimestamp(),approvedBy:currentUser.uid,approvedAmount:amount});});showNotice('আবেদন অনুমোদিত হয়েছে এবং ব্যালেন্স আপডেট হয়েছে।');await renderPage()}

function bindForms(){document.querySelectorAll('.dataForm').forEach(f=>{const no=f.querySelector('[name="memberNo"]');if(no){const details=document.createElement('div');details.className='memberLookupDetails';no.parentElement.insertAdjacentElement('afterend',details);no.addEventListener('change',()=>fillMemberDetails(f,no.value));no.addEventListener('blur',()=>{if(no.value.trim())fillMemberDetails(f,no.value)});}const inv=f.querySelector('[name="invoiceNo"]');if(inv&&f.querySelector('.invoiceLookupDetails')){inv.addEventListener('change',()=>lookupSaleInvoice(f,inv.value));inv.addEventListener('blur',()=>{if(inv.value.trim())lookupSaleInvoice(f,inv.value)});}const recalc=()=>calculateLoanPreview(f);['deposit','installments','repaymentMode','installmentType'].forEach(n=>{const el=f.querySelector(`[name="${n}"]`);if(el){el.addEventListener('input',recalc);el.addEventListener('change',recalc)}});const mode=f.querySelector('[name="repaymentMode"]');if(mode){const applyMode=()=>{const cash=mode.value==='cash';['installmentType','installments'].forEach(n=>{const el=f.querySelector(`[name="${n}"]`);if(el){el.disabled=cash;el.required=!cash}});recalc()};mode.addEventListener('change',applyMode);applyMode()}f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('button[type="submit"],button');b.disabled=true;try{const result=await f._save(f);showNotice(typeof result==='string'?result:'তথ্য Firestore-এ সংরক্ষিত হয়েছে।');await renderPage()}catch(err){showNotice('সংরক্ষণ করা যায়নি: '+err.message,true)}finally{b.disabled=false}}});const pf=document.querySelector('#passwordForm');if(pf)pf.onsubmit=async e=>{e.preventDefault();const b=pf.querySelector('button');b.disabled=true;try{const msg=await changePassword(pf);showMsg($('passwordMsg'),msg,false);pf.reset()}catch(err){showMsg($('passwordMsg'),'পাসওয়ার্ড পরিবর্তন হয়নি: '+err.message,true)}finally{b.disabled=false}};document.querySelectorAll('[data-copy-invoice]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copyInvoice);showNotice('ইনভয়েস নম্বর কপি হয়েছে: '+b.dataset.copyInvoice)}catch{showNotice('ইনভয়েস নম্বর কপি করা যায়নি। নম্বরটি হাতে কপি করুন: '+b.dataset.copyInvoice,true)}})}function showNotice(s,err=false){showMsg($('notice'),s,err)}
async function listTable(coll,cols){let snap=await getDocs(query(collection(db,coll),orderBy('createdAt','desc'),limit(100)));let rows=snap.docs.map(d=>({id:d.id,...d.data()}));return `<div class="panel"><div class="section-head"><h2>${labels[coll]||coll} — সাম্প্রতিক ১০০টি</h2><button class="secondary" onclick="window.print()">প্রিন্ট</button></div><div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th>${safe(c[1])}</th>`).join('')}${coll==='sales'?'<th>কপি</th>':''}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${safe(c[2]?c[2](r):r[c[0]]??'—')}</td>`).join('')}${coll==='sales'?`<td><button type="button" class="secondary" data-copy-invoice="${safe(r.invoiceNo||'')}">ইনভয়েস কপি</button></td>`:''}</tr>`).join('')||`<tr><td colspan="${cols.length+(coll==='sales'?1:0)}">এখনো কোনো তথ্য নেই</td></tr>`}</tbody></table></div></div>`}

function applyLanguage(root=document.body){if(currentLang!=='en')return;const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);for(const n of nodes){const raw=n.nodeValue,trim=raw.trim();if(!trim)continue;let replacement=enMap[trim];if(!replacement){for(const [bn,en] of Object.entries(enMap)){if(trim.startsWith(bn)&&trim.length>bn.length&&bn.endsWith(':')){replacement=en+trim.slice(bn.length);break}}}if(replacement)n.nodeValue=raw.replace(trim,replacement)}root.querySelectorAll('input[placeholder]').forEach(el=>{const t=el.getAttribute('placeholder');if(enMap[t])el.setAttribute('placeholder',enMap[t])});}
function refreshLanguage(){document.documentElement.lang=currentLang==='en'?'en':'bn';$('langToggle').textContent=currentLang==='en'?'বাংলা':'English';try{localStorage.setItem('samitiLang',currentLang)}catch{}applyLanguage(document.body);if(profile){renderNav();renderPage()}}
$('langToggle').addEventListener('click',()=>{currentLang=currentLang==='bn'?'en':'bn';try{localStorage.setItem('samitiLang',currentLang)}catch{}window.location.reload()});
