async function createMember(form){if(profile?.role!=='admin'&&!can('members'))throw new Error('সদস্য তৈরি করার অনুমতি নেই।');const fd=new FormData(form),data=Object.fromEntries(fd.entries());data.name=String(data.name||'').trim();data.phone=String(data.phone||'').trim();data.address=String(data.address||'').trim();if(!data.name||!data.phone||!data.address)throw new Error('সদস্যের নাম, মোবাইল ও ঠিকানা দিন।');const all=await getDocs(collection(db,'members'));let maxNo=0;all.docs.forEach(d=>{const n=parseInt(normalizeDigits(d.data().memberNo||''),10);if(Number.isFinite(n))maxNo=Math.max(maxNo,n)});const counterRef=doc(db,'counters','members'),memberRef=doc(collection(db,'members'));let newNo='';await runTransaction(db,async t=>{const c=await t.get(counterRef);const next=Math.max(c.exists()?Number(c.data().value||0):0,maxNo)+1;newNo=String(next).padStart(2,'0');t.set(counterRef,{value:next,updatedAt:serverTimestamp(),updatedBy:currentUser.uid});t.set(memberRef,{...data,memberNo:newNo,status:'active',createdAt:serverTimestamp(),createdBy:currentUser.uid,createdByEmail:currentUser.email})});return `সদস্য সফলভাবে তৈরি হয়েছে! নতুন সদস্য নম্বর: ${newNo}`}

async function saveSale(form){const fd=new FormData(form),d=Object.fromEntries(fd.entries());d.memberNo=String(d.memberNo||'').trim();d.memberName=String(d.memberName||'').trim();if(!d.memberNo)throw new Error('সদস্য নম্বর দিন।');const m=await findMemberByNo(d.memberNo);if(!m)throw new Error('সঠিক সদস্য নম্বর দিন।');d.memberName=m.name||d.memberName;d.quantity=Number(d.quantity);d.price=Number(d.price);d.deposit=Number(d.deposit||0);if(!Number.isFinite(d.quantity)||!Number.isFinite(d.price)||d.quantity<=0||d.price<=0)throw new Error('পরিমাণ ও একক মূল্য শূন্যের বেশি হতে হবে।');d.total=d.quantity*d.price;if(d.deposit<0||d.deposit>d.total)throw new Error('অগ্রিম জমা ০ থেকে মোট দামের মধ্যে হতে হবে।');d.balance=d.total-d.deposit;d.invoiceNo=makeInvoiceNo();d.status='recorded';d.date=d.date||dateNow();d.createdAt=serverTimestamp();d.createdBy=currentUser.uid;d.createdByEmail=currentUser.email;let productRef=null; if(d.productCode){const ps=await getDocs(collection(db,'products'));const productDoc=ps.docs.find(x=>String(x.data().productCode||'')===d.productCode)||null;if(!productDoc)throw new Error('এই পণ্য কোডে কোনো পণ্য পাওয়া যায়নি। আগে পণ্য তৈরি করুন।');productRef=doc(db,'products',productDoc.id);d.costPrice=Number(productDoc.data().costPrice||0);d.costTotal=d.costPrice*d.quantity;}else{d.costPrice=0;d.costTotal=0;}const saleRef=doc(collection(db,'sales'));await runTransaction(db,async t=>{let currentProduct=null;if(productRef){const snap=await t.get(productRef);if(!snap.exists())throw new Error('পণ্যটি আর পাওয়া যাচ্ছে না।');currentProduct=snap.data();const stock=Number(currentProduct.quantity||0);if(stock<d.quantity)throw new Error('পর্যাপ্ত স্টক নেই। বর্তমান স্টক: '+stock);}t.set(saleRef,d);if(productRef)t.update(productRef,{quantity:Number(currentProduct.quantity||0)-d.quantity,updatedAt:serverTimestamp(),updatedBy:currentUser.uid});});window.lastCreatedInvoice={...d};return `পণ্য বিক্রি সফল হয়েছে। ইনভয়েস নম্বর: ${d.invoiceNo}; মোট: ${money(d.total)}; অগ্রিম: ${money(d.deposit)}; বাকি: ${money(d.balance)}`}
async function lookupSaleInvoice(form,invoiceNo){const code=String(invoiceNo||'').trim();const box=form.querySelector('.invoiceLookupDetails');if(box)box.innerHTML='<span class="small">ইনভয়েস খোঁজা হচ্ছে…</span>';if(!code)return;try{const snap=await getDocs(collection(db,'sales'));const sale=snap.docs.map(d=>({id:d.id,...d.data()})).find(x=>String(x.invoiceNo||'').toLowerCase()===code.toLowerCase());if(!sale){if(box)box.innerHTML='<div class="msg error">এই ইনভয়েস নম্বর পাওয়া যায়নি।</div>';return}const m=await findMemberByNo(sale.memberNo);setFormValue(form,'memberNo',sale.memberNo||'');setFormValue(form,'memberName',sale.memberName||m?.name||'');setFormValue(form,'productName',sale.productName||'');setFormValue(form,'productCode',sale.productCode||'');setFormValue(form,'totalAmount',sale.total||Number(sale.quantity||0)*Number(sale.price||0));const totalInput=form.querySelector('[name="totalAmount"]');if(totalInput)totalInput.readOnly=true;form.dataset.invoiceTotal=String(sale.total||Number(sale.quantity||0)*Number(sale.price||0));form.dataset.invoiceNo=sale.invoiceNo;const deposit=form.querySelector('[name="deposit"]');if(deposit)deposit.value=String(Number(sale.deposit||0));const used=await getDocs(collection(db,'loans'));const exists=used.docs.some(d=>String(d.data().invoiceNo||'')===String(sale.invoiceNo));if(box)box.innerHTML=`<div class="msg ${exists?'error':''}"><b>${exists?'সতর্কতা: এই ইনভয়েসে আগে ঋণ রেকর্ড আছে':'ইনভয়েস পাওয়া গেছে'}</b><br>ইনভয়েস: ${safe(sale.invoiceNo)}<br>সদস্য নম্বর: ${safe(sale.memberNo||'—')}<br>সদস্য: ${safe(sale.memberName||m?.name||'—')}<br>পণ্য: ${safe(sale.productName||'—')}<br>মোট মূল্য: ${money(sale.total||0)}<br>বিক্রির সময় জমা: ${money(sale.deposit||0)}<br>বিক্রির সময় বাকি: ${money(sale.balance||0)}</div>`;calculateLoanPreview(form)}catch(err){if(box)box.innerHTML=`<div class="msg error">ইনভয়েস আনা যায়নি: ${safe(err.message)}</div>`}}
function calculateLoanPreview(form){const total=Number(form.dataset.invoiceTotal||form.querySelector('[name="principal"]')?.dataset.invoiceTotal||0);const deposit=Number(form.querySelector('[name="deposit"]')?.value||0);const mode=form.querySelector('[name="repaymentMode"]')?.value||'installment';const count=Math.max(1,Number(form.querySelector('[name="installments"]')?.value||1));const principal=Math.max(0,total-deposit);const p=form.querySelector('[name="principal"]');if(p&&form.dataset.invoiceTotal){p.value=principal.toFixed(2);p.readOnly=true}else if(p)p.readOnly=false;const amount=form.querySelector('[name="installmentAmount"]');if(amount)amount.value=mode==='installment'?(principal/count).toFixed(2):principal.toFixed(2);const info=form.querySelector('.loanCalcDetails');if(info)info.innerHTML=`<div class="msg">মোট ইনভয়েস: ${money(total)}<br>জমা: ${money(deposit)}<br><b>ঋণ/বাকি: ${money(principal)}</b><br>${mode==='installment'?'প্রতি '+(form.querySelector('[name="installmentType"]')?.value==='weekly'?'সপ্তাহে':'মাসে')+' কিস্তি: '+money(principal/count):'নগদ পরিশোধ: '+money(principal)}</div>`}
async function saveLoan(form){const fd=new FormData(form),d=Object.fromEntries(fd.entries());d.invoiceNo=String(d.invoiceNo||'').trim();d.memberNo=String(d.memberNo||'').trim();d.memberName=String(d.memberName||'').trim();d.deposit=Number(d.deposit||0);d.principal=Number(d.principal||0);d.totalAmount=Number(d.totalAmount||0);d.installments=Math.max(1,Number(d.installments||1));d.installmentAmount=Number(d.installmentAmount||d.principal/d.installments);if(!d.memberNo)throw new Error('সদস্য নম্বর দিন বা ইনভয়েস দিয়ে সদস্য খুঁজুন।');const m=await findMemberByNo(d.memberNo);if(!m)throw new Error('সদস্য নম্বর সঠিক নয়।');d.memberName=m.name||d.memberName;if(d.totalAmount&&d.deposit>d.totalAmount)throw new Error('জমার পরিমাণ ইনভয়েসের মোট দামের চেয়ে বেশি।');if(d.totalAmount)d.principal=Math.max(0,d.totalAmount-d.deposit);if(d.repaymentMode==='cash')d.installmentAmount=d.principal;else d.installmentAmount=d.principal/d.installments;const allLoans=await getDocs(collection(db,'loans'));if(d.invoiceNo&&allLoans.docs.some(x=>String(x.data().invoiceNo||'')===d.invoiceNo))throw new Error('এই ইনভয়েস দিয়ে আগে ঋণ রেকর্ড করা হয়েছে।');let maxLoanNo=0;allLoans.docs.forEach(x=>{const m=String(x.data().loanNo||'').match(/^LN-(\d+)$/i);if(m)maxLoanNo=Math.max(maxLoanNo,Number(m[1]))});d.status='recorded';d.createdAt=serverTimestamp();d.createdBy=currentUser.uid;d.createdByEmail=currentUser.email;d.staffName=profile.name||profile.username||currentUser.email;const counterRef=doc(db,'counters','loans'),loanRef=doc(collection(db,'loans'));let newLoanNo='';await runTransaction(db,async t=>{const c=await t.get(counterRef);const next=Math.max(c.exists()?Number(c.data().value||0):0,maxLoanNo)+1;newLoanNo='LN-'+String(next).padStart(4,'0');t.set(counterRef,{value:next,updatedAt:serverTimestamp(),updatedBy:currentUser.uid});t.set(loanRef,{...d,loanNo:newLoanNo})});return `ঋণ রেকর্ড সফলভাবে তৈরি হয়েছে। ঋণ নম্বর: ${newLoanNo}; অবশিষ্ট ঋণ: ${money(d.principal)}; প্রতি কিস্তি: ${money(d.installmentAm async function createWorker(form){if(profile?.role!=='admin')throw new Error('শুধু অ্যাডমিন কর্মী অ্যাকাউন্ট তৈরি করতে পারবেন।');const fd=new FormData(form),name=String(fd.get('name')||'').trim(),username=String(fd.get('username')||'').trim().toLowerCase(),password=String(fd.get('password')||'');if(!name)throw new Error('কর্মীর নাম দিন।');if(password.length<6)throw new Error('পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।');const email=usernameEmail(username);let createdUid='';await withSecondaryAuth(async secondaryAuth=>{const cred=await createUserWithEmailAndPassword(secondaryAuth,email,password);createdUid=cred.user.uid});try{await setDoc(doc(db,'users',createdUid),{name,username,role:'staff',active:true,permissions:{...ALL_STAFF_PERMISSIONS},createdAt:serverTimestamp(),createdBy:currentUser.uid});return 'কর্মী অ্যাকাউন্ট তৈরি হয়েছে। ইউজারনেম: '+username}catch(err){throw new Error('Auth অ্যাকাউন্ট তৈরি হয়েছে, কিন্তু প্রোফাইল সংরক্ষণ হয়নি। Firebase Console-এ Auth Users ও Firestore users যাচাই করুন। '+err.message)}}

function balanceId(memberNo){return encodeURIComponent(String(memberNo||'').trim())}
async function calculateLegacyBalance(memberNo){const snap=await getDocs(collection(db,'savingsTransactions'));let total=0;for(const d of snap.docs){const r=d.data();if(String(r.memberNo||'').trim()!==String(memberNo||'').trim()||r.status!=='approved')continue;const a=Number(r.amount||0);if(r.type==='deposit')total+=a;else if(r.type==='refund')total-=a;}return Math.max(0,total)}
async function recordSavingsMovement(raw,type){const data={...raw};data.memberNo=String(data.memberNo||'').trim();data.memberName=String(data.memberName||'').trim();data.amount=Number(data.amount);if(!String(data.receiptNo||'').trim())data.receiptNo=makeReceiptNo();if(!data.memberNo)throw new Error('সদস্য নম্বর দিন।');if(!Number.isFinite(data.amount)||data.amount<=0)throw new Error('পরিমাণ শূন্যের বেশি হতে হবে।');const seedBalance=await calculateLegacyBalance(data.memberNo);const balanceRef=doc(db,'savingsBalances',balanceId(data.memberNo));const txRef=doc(collection(db,'savingsTransactions'));await runTransaction(db,async t=>{const b=await t.get(balanceRef);const current=b.exists()?Number(b.data().balance||0):seedBalance;if(type==='refund'&&data.amount>current)throw new Error('সঞ্চয় ব্যালেন্স অপর্যাপ্ত। বর্তমান ব্যালেন্স: '+money(current));const next=type==='deposit'?current+data.amount:current-data.amount;t.set(balanceRef,{memberNo:data.memberNo,memberName:data.memberName,balance:next,updatedAt:serverTimestamp(),updatedBy:currentUser.uid});t.set(txRef,{...data,type,status:'approved',createdAt:serverTimestamp(),createdBy:currentUser.uid,createdByEmail:currentUser.email});});return true}

async function renderPassbook(term){const out=$('passbookResults');out.innerHTML='<p>খোঁজা হচ্ছে…</p>';const qtext=String(term||'').trim().toLocaleLowerCase('bn');if(!qtext){out.innerHTML='<p class="msg error">সদস্য নম্বর বা নাম লিখুন।</p>';return}const [ms,ts]=await Promise.all([getDocs(collection(db,'members')),getDocs(collection(db,'savingsTransactions'))]);const members=ms.docs.map(d=>({id:d.id,...d.data()}));const txs=ts.docs.map(d=>({id:d.id,...d.data()}));let found=members.filter(m=>String(m.memberNo||'').toLocaleLowerCase('bn').includes(qtext)||String(m.name||'').toLocaleLowerCase('bn').includes(qtext));if(!found.length){const txMembers=new Map();txs.filter(t=>String(t.memberNo||'').toLocaleLowerCase('bn').includes(qtext)||String(t.memberName||'').toLocaleLowerCase('bn').includes(qtext)).forEach(t=>txMembers.set(String(t.memberNo||t.memberName),{memberNo:t.memberNo||'',name:t.memberName||''}));found=[...txMembers.values()]}if(!found.length){out.innerHTML='<p class="msg">এই নামে বা নম্বরে কোনো সদস্য/লেনদেন পাওয়া যায়নি।</p>';return}const exact=found.length===1?found[0]:found.find(m=>String(m.memberNo||'').trim().toLocaleLowerCase('bn')===qtext)||found.find(m=>String(m.name||'').trim().toLocaleLowerCase('bn')===qtext);if(!exact){out.innerHTML='<div class="panel"><h3>একাধিক সদস্য পাওয়া গেছে</h3><p>সঠিক সদস্য নির্বাচন করতে নম্বরসহ অনুসন্ধান করুন:</p><div class="table-wrap"><table><thead><tr><th>সদস্য নম্বর</th><th>নাম</th><th>নির্বাচন</th></tr></thead><tbody>'+found.map(m=>`<tr><td>${safe(m.memberNo||'—')}</td><td>${safe(m.name||m.memberName||'—')}</td><td><button type="button" class="secondary" data-pb-select="${safe(m.memberNo||'')}" data-pb-name="${safe(m.name||m.memberName||'')}">দেখুন</button></td></tr>`).join('')+'</tbody></table></div></div>';out.querySelectorAll('[data-pb-select]').forEach(b=>b.onclick=()=>renderPassbook(b.dataset.pbSelect||b.dataset.pbName));return}const no=String(exact.memberNo||'').trim(),name=String(exact.name||exact.memberName||'').trim();const rows=txs.filter(t=>(no&&String(t.memberNo||'').trim()===no)||(!no&&name&&String(t.memberName||'').trim()===name)).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));let deposits=0,refunds=0;rows.forEach(r=>{if(r.status==='approved'&&r.type==='deposit')deposits+=Number(r.amount||0);if(r.status==='approved'&&r.type==='refund')refunds+=Number(r.amount||0)});out.innerHTML=`<div class="stats"><div class="stat"><span>সদস্য নম্বর</span><strong>${safe(no||'—')}</strong></div><div class="stat"><span>সদস্যের নাম</span><strong>${safe(name||'—')}</strong></div><div class="stat"><span>মোট অনুমোদিত জমা</span><strong>${money(deposits)}</strong></div><div class="stat"><span>মোট অনুমোদিত ফেরত</span><strong>${money(refunds)}</strong></div><div class="stat"><span>বর্তমান হিসাবি ব্যালেন্স</span><strong>${money(Math.max(0,deposits-refunds))}</strong></div></div><div class="panel"><div class="section-head"><h2>লেনদেনের বিবরণ</h2><button class="secondary" type="button" onclick="window.print()">প্রিন্ট</button></div><div class="table-wrap"><table><thead><tr><th>তারিখ</th><th>ধরন</th><th>পরিমাণ</th><th>রসিদ</th><th>অবস্থা</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${safe(r.date||'—')}</td><td>${safe(r.type==='deposit'?'সঞ্চয় জমা':r.type==='refund'?'সঞ্চয় ফেরত':r.type||'—')}</td><td>${money(r.amount)}</td><td>${safe(r.receiptNo||'—')}</td><td>${safe(r.status||'—')}</td></tr>`).join('')||'<tr><td colspan="5">এই সদস্যের কোনো লেনদেন নেই।</td></tr>'}</tbody></table></div></div>`}

async function getFinancialData(){const [ms,ss,ls,cs,vs]=await Promise.all([getDocs(collection(db,'members')),getDocs(collection(db,'savingsTransactions')),getDocs(collection(db,'loans')),getDocs(collection(db,'collections')),getDocs(collection(db,'villages'))]);return {members:ms.docs.map(d=>({id:d.id,...d.data()})),savings:ss.docs.map(d=>({id:d.id,...d.data()})),loans:ls.docs.map(d=>({id:d.id,...d.data()})),collections:cs.docs.map(d=>({id:d.id,...d.data()})),villages:vs.docs.map(d=>({id:d.id,...d.data()}))}}
function financialFor(no,data){const key=normalizeDigits(no);const savings=data.savings.filter(x=>normalizeDigits(x.memberNo)===key&&x.status==='approved');let saving=0;savings.forEach(x=>saving+=(x.type==='deposit'?1:-1)*Number(x.amount||0));const loans=data.loans.filter(x=>normalizeDigits(x.memberNo)===key);const principal=loans.reduce((n,x)=>n+Number(x.principal||0),0);const paid=data.collections.filter(x=>normalizeDigits(x.memberNo)===key&&x.status==='approved').reduce((n,x)=>n+Number(x.amount||0),0);return {saving:Math.max(0,saving),loan:Math.max(0,principal-paid),savingsRows:savings,loans,paid}}

async function lookupMemberLoansForCollection(form,memberNo){const box=form.querySelector('.loanCollectionDetails');if(box)box.innerHTML='<span class="small">সদস্যের ঋণ খোঁজা হচ্ছে…</span>';const sel=form.querySelector('[name="loanNo"]');if(sel)sel.innerHTML='<option value="">ঋণ খুঁজুন…</option>';try{const data=await getFinancialData();const key=normalizeDigits(memberNo);const member=data.members.find(m=>normalizeDigits(m.memberNo)===key);if(!member){if(box)box.innerHTML='<div class="msg error">এই সদস্য নম্বর পাওয়া যায়নি।</div>';setFormValue(form,'memberName','');return}setFormValue(form,'memberName',member.name||'');const loans=data.loans.filter(l=>normalizeDigits(l.memberNo)===key&&(l.status==='recorded'||l.status==='approved'||!l.status));if(!loans.length){if(box)box.innerHTML='<div class="msg error">এই সদস্যের কোনো ঋণ রেকর্ড পাওয়া যায়নি।</div>';return}const balanceFor=l=>{const linked=data.collections.filter(c=>String(c.loanNo||'')===String(l.loanNo||'')&&c.status!=='rejected'&&c.status!=='pending');let paid=linked.reduce((n,c)=>n+Number(c.amount||0),0);if(!linked.length&&loans.length===1)paid=data.collections.filter(c=>normalizeDigits(c.memberNo)===key&&!c.loanNo&&c.status!=='rejected'&&c.status!=='pending').reduce((n,c)=>n+Number(c.amount||0),0);return Math.max(0,Number(l.principal||0)-paid)};form._loanCollectionData={data,member,loans,balanceFor};if(sel)sel.innerHTML=loans.map((l,i)=>`<option value="${safe(l.loanNo||l.id)}" ${i===0?'selected':''}>${safe(l.loanNo||'ঋণ')} — বাকি ${money(balanceFor(l))}</option>`).join('');const render=()=>{const chosen=loans.find(l=>String(l.loanNo||l.id)===String(sel?.value))||loans[0];if(!chosen)return;setFormValue(form,'installmentAmount',Number(chosen.installmentAmount||0));const info=`<div class="msg"><b>সদস্যের তথ্য</b><br>সদস্য নম্বর: ${safe(member.memberNo||'')}<br>সদস্যের নাম: ${safe(member.name||'')}<br>ঋণ নম্বর: ${safe(chosen.loanNo||'')}<br>ঋণের পরিমাণ: ${money(chosen.principal||0)}<br>প্রতি কিস্তি: ${money(chosen.installmentAmount||0)}<br><b>এখনও বাকি: ${money(balanceFor(chosen))}</b></div>`;if(box)box.innerHTML=info;form.dataset.selectedLoanNo=String(chosen.loanNo||chosen.id);form.dataset.loanBalance=String(balanceFor(chosen));};if(sel)sel.onchange=render;render()}catch(e){if(box)box.innerHTML=`<div class="msg error">ঋণের তথ্য আনা যায়নি: ${safe(e.message)}</div>`}}
async function saveInstallmentCollection(form){const d=Object.fromEntries(new FormData(form).entries());const memberNo=String(d.memberNo||'').trim(),loanNo=String(d.loanNo||'').trim(),amount=Number(d.amount||0);if(!memberNo)throw new Error('সদস্য নম্বর দিন।');if(!Number.isFinite(amount)||amount<=0)throw new Error('জমার পরিমাণ শূন্যের বেশি লিখুন।');const lookup=form._loanCollectionData;if(!lookup||normalizeDigits(lookup.member.memberNo)!==normalizeDigits(memberNo))throw new Error('আগে সঠিক সদস্য নম্বর দিয়ে ঋণের তথ্য আনুন।');const loan=lookup.loans.find(l=>String(l.loanNo||l.id)===loanNo);if(!loan)throw new Error('ঋণ নম্বর নির্বাচন করুন।');const balance=lookup.balanceFor(loan);if(balance<=0)throw new Error('এই ঋণের কোনো বকেয়া নেই।');if(amount>balance)throw new Error('জমার পরিমাণ বকেয়া ঋণের চেয়ে বেশি হতে পারবে না। বাকি: '+money(balance));const data={memberNo:lookup.member.memberNo,memberName:lookup.member.name||'',loanNo:loan.loanNo||loan.id,installmentAmount:Number(loan.installmentAmount||0),amount,date:d.date||dateNow(),paymentFor:loan.loanType==='cash'?'cashLoan':loan.loanType==='product'?'productLoan':'productLoan',receiptNo:String(d.receiptNo||makeReceiptNo()),note:'',status:profile.role==='admin'?'approved':'pending',createdAt:serverTimestamp(),createdBy:currentUser.uid,createdByEmail:currentUser.email,staffName:profile.name||profile.username||currentUser.email};await addDoc(collection(db,'collections'),data);return `কিস্তি জমা সংরক্ষিত হয়েছে। ঋণ নম্বর: ${data.loanNo}; জমা: ${money(amount)}; জমার আগের বাকি: ${money(balance)}; নতুন বাকি: ${money(balance-amount)}`}
async function renderStatement(form){const fd=new FormData(form),no=String(fd.get('memberNo')||'').trim(),from=String(fd.get('fromDate')||''),to=String(fd.get('toDate')||'');const out=$('statementResults');out.innerHTML='<div class="panel">স্টেটমেন্ট তৈরি হচ্ছে…</div>';const data=await getFinancialData();const m=data.members.find(x=>normalizeDigits(x.memberNo)===normalizeDigits(no));if(!m){out.innerHTML='<div class="panel msg error">এই সদস্য নম্বর পাওয়া যায়নি।</div>';return}const tx=[...data.savings.filter(x=>normalizeDigits(x.memberNo)===normalizeDigits(no)).map(x=>({...x,kind:x.type==='deposit'?'সঞ্চয় জমা':x.type==='refund'?'সঞ্চয় ফেরত':x.type||'সঞ্চয়'})),...data.collections.filter(x=>normalizeDigits(x.memberNo)===normalizeDigits(no)).map(x=>({...x,kind:'ঋণ/কিস্তি জমা'}))].filter(x=>(!from||String(x.date||'')>=from)&&(!to||String(x.date||'')<=to)).sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));const f=financialFor(no,data);out.innerHTML=`<div class="panel print-area"><div class="print-brand"><img src="./logo.png" alt="লোগো" onerror="this.style.display='none'"><div><h2>স্বপ্নচূড়া পণ্য ঋণ বিতরণ সমিতি</h2><strong>সদস্য স্টেটমেন্ট</strong></div></div><p><b>সদস্য নম্বর:</b> ${safe(m.memberNo)}　<b>নাম:</b> ${safe(m.name)}　<b>গ্রাম:</b> ${safe(m.village||'—')}</p><p><b>সময়সীমা:</b> ${safe(from||'শুরু থেকে')} — ${safe(to||'আজ পর্যন্ত')}</p><div class="stats"><div class="stat"><span>বর্তমান ঋণ</span><strong>${money(f.loan)}</strong></div><div class="stat"><span>বর্তমান সঞ্চয়</span><strong>${money(f.saving)}</strong></div></div><div class="table-wrap"><table><thead><tr><th>তারিখ</th><th>বিবরণ</th><th>রশিদ নম্বর</th><th>জমা</th><th>অবস্থা</th></tr></thead><tbody>${tx.map(x=>`<tr><td>${safe(x.date||'—')}</td><td>${safe(x.kind)}</td><td>${safe(x.receiptNo||'—')}</td><td>${money(x.amount||0)}</td><td>${safe(x.status||'—')}</td></tr>`).join('')||'<tr><td colspan="5">এই সময়ে কোনো লেনদেন নেই।</td></tr>'}</tbody></table></div></div>`}
async function lookupProduct(form,term,fieldName){const value=String(term||'').trim().toLocaleLowerCase('bn');if(!value)return;const box=form.querySelector('.productLookupDetails');if(box)box.textContent='পণ্য খোঁজা হচ্ছে…';try{const snap=await getDocs(collection(db,'products'));const products=snap.docs.map(d=>({id:d.id,...d.data()}));const p=products.find(x=>String(x.productCode||'').trim().toLocaleLowerCase('bn')===value)||products.find(x=>String(x.name||'').trim().toLocaleLowerCase('bn')===value)||products.find(x=>String(x.productCode||'').trim().toLocaleLowerCase('bn').includes(value))||products.find(x=>String(x.name||'').trim().toLocaleLowerCase('bn').includes(value));if(!p){if(box)box.innerHTML='<span class="small">এই কোড/নামে পণ্য নেই।</span>';return}setFormValue(form,'productCode',p.productCode||'');setFormValue(form,'productName',p.name||'');if(form.querySelector('[name="price"]'))setFormValue(form,'price',p.salePrice||'');if(form.querySelector('[name="costPrice"]'))setFormValue(form,'costPrice',p.costPrice||'');if(box)box.innerHTML=`<div class="msg">পণ্য: <b>${safe(p.name||'—')}</b> · কোড: ${safe(p.productCode||'—')} · বিক্রয়মূল্য: ${money(p.salePrice)} · ক্রয়মূল্য: ${money(p.costPrice)} · স্টক: ${safe(p.quantity??'—')}</div>`}catch(e){if(box)box.textContent='পণ্যের তথ্য আনা যায়নি: '+e.message}}
async function decideCollection(id,decision){if(profile?.role!=='admin')throw new Error('শুধু Admin কালেকশন অনুমোদন বা প্রত্যাখ্যান করতে পারবেন।');const ref=doc(db,'collections',id);await runTransaction(db,async t=>{const snap=await t.get(ref);if(!snap.exists())throw new Error('কালেকশন রেকর্ড পাওয়া যায়নি।');if(snap.data().status==='approved'||snap.data().status==='rejected')throw new Error('এই কালেকশন ইতিমধ্যে নিষ্পত্তি হয়েছে।');t.update(ref,{status:decision==='approve'?'approved':'rejected',reviewedAt:serverTimestamp(),reviewedBy:currentUser.uid,reviewedByEmail:currentUser.email})});showNotice(decision==='approve'?'কালেকশন অনুমোদিত হয়েছে।':'কালেকশন প্রত্যাখ্যান করা হয়েছে।');await renderPage()}
async function dailyCollectionSheet(date=dateNow()){const data=await getFinancialData();let daySchedule={};try{const ds=await getDoc(doc(db,'settings','dayVillageSchedule'));if(ds.exists())daySchedule=ds.data().schedule||{}}catch{};const dayNames=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];const weekday=dayNames[new Date(String(date)+'T12:00:00').getDay()];if(!window.dailyVillageFilter)window.dailyVillageFilter=String(daySchedule[weekday]||'');const all=data.collections;const dayRows=all.filter(r=>String(r.date||'')===date&&r.status!=='rejected');const sum=arr=>arr.reduce((n,r)=>n+Number(r.amount||0),0);const villages=[...new Set([...(data.villages||[]).map(v=>String(v.name||'').trim()),...data.members.map(m=>String(m.village||'').trim())].filter(Boolean))].sort((a,b)=>a.localeCompare(b,'bn'));const village=window.dailyVillageFilter||'';const normVillage=v=>String(v||'').trim().replace(/\s+/g,' ').toLocaleLowerCase('bn');const gender=window.dailyGenderFilter||'all';const memberList=data.members.filter(m=>(!village||normVillage(m.village||m.villageName||m.village_name)===normVillage(village))&&(!gender||gender==='all'||m.gender===gender||(!m.gender&&gender==='all'))).sort((a,b)=>String(a.memberNo||'').localeCompare(String(b.memberNo||''),undefined,{numeric:true}));const todaySavings=data.savings.filter(x=>String(x.date||'')===date&&x.status==='approved'&&x.type==='deposit');const todayLoans=dayRows.filter(x=>x.status==='approved');const rows=memberList.map(m=>{const f=financialFor(m.memberNo,data);const prior=f.savingsRows.filter(x=>x.type==='deposit'&&String(x.date||'')<date).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));const todayS=todaySavings.filter(x=>normalizeDigits(x.memberNo)===normalizeDigits(m.memberNo)).reduce((n,x)=>n+Number(x.amount||0),0);const todayL=todayLoans.filter(x=>normalizeDigits(x.memberNo)===normalizeDigits(m.memberNo)).reduce((n,x)=>n+Number(x.amount||0),0);return {m,f,last:prior[0]||null,todayS,todayL}});return `<div class="panel no-print"><div class="section-head"><h2>দৈনিক কালেকশন শিট — গ্রাম ও মহিলা/পুরুষভিত্তিক A4</h2><button type="button" class="secondary" onclick="window.print()">প্রিন্ট / PDF</button></div><form id="dailySheetForm" class="grid"><div class="field"><label>তারিখ নির্বাচন</label><input type="date" name="sheetDate" value="${safe(date)}" required></div><div class="field"><label>গ্রাম নির্বাচন</label><select name="village"><option value="" ${!village?'selected':''}>সব গ্রাম</option>${villages.map(v=>`<option value="${safe(v)}" ${normVillage(v)===normVillage(village)&&village?'selected':''}>${safe(v)}</option>`).join('')}</select></div><div class="field"><label>শিটের ধরন</label><select name="gender"><option value="female" ${gender==='female'?'selected':''}>মহিলা সদস্য</option><option value="male" ${gender==='male'?'selected':''}>পুরুষ সদস্য</option><option value="all" ${gender==='all'?'selected':''}>সব সদস্য</option></select></div><div class="actions" style="align-items:end"><button>শিট তৈরি করুন</button></div></form></div><div class="panel print-area" id="dailyPrintSheet"><div class="print-brand"><img src="./logo.png" alt="স্বপ্নচূড়া লোগো" onerror="this.style.display='none'"><div><h2>স্বপ্নচূড়া পণ্য ঋণ বিতরণ সমিতি</h2><strong>দৈনিক কালেকশন শিট</strong></div></div><div class="sheet-meta"><span><b>তারিখ:</b> ${safe(date)}</span><span><b>গ্রাম:</b> ${safe(village||'সব গ্রাম')}</span><span><b>সদস্য:</b> ${gender==='female'?'মহিলা':gender==='male'?'পুরুষ':'সকল'}</span><span><b>মোট সদস্য:</b> ${rows.length}</span></div><div class="table-wrap"><table class="a4-sheet"><thead><tr><th>ক্রম</th><th>সদস্য নং</th><th>সদস্যের নাম</th><th>বর্তমান ঋণ</th><th>বর্তমান সঞ্চয়</th><th>শেষ জমার তারিখ</th><th>শেষ জমা</th><th>আজ সঞ্চয় জমা</th><th>আজ ঋণ জমা</th><th>স্বাক্ষর</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${safe(r.m.memberNo||'')}</td><td>${safe(r.m.name||'')}</td><td>${money(r.f.loan)}</td><td>${money(r.f.saving)}</td><td> async function approvalsPage(){const snap=await getDocs(collection(db,'refundRequests'));const rows=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>{const ap=a.status==='pending'?0:1,bp=b.status==='pending'?0:1;return ap-bp||String(b.date||'').localeCompare(String(a.date||''))});return `<div class="panel"><h2>সঞ্চয় ফেরতের অপেক্ষমাণ আবেদন</h2><p>অনুমোদনের সময় সদস্যের অনুমোদিত জমা থেকে অনুমোদিত ফেরত বাদ দিয়ে ব্যালেন্স যাচাই করা হবে। অনুমোদন ও ব্যালেন্স আপডেট একসঙ্গে সংরক্ষিত হবে।</p><div class="table-wrap"><table><thead><tr><th>সদস্য নম্বর</th><th>নাম</th><th>পরিমাণ</th><th>তারিখ</th><th>কারণ</th><th>অবস্থা</th><th>কাজ</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${safe(r.memberNo||'—')}</td><td>${safe(r.memberName||'—')}</td><td>${money(r.amount)}</td><td>${safe(r.date||'—')}</td><td>${safe(r.reason||'—')}</td><td>${safe(r.status||'pending')}</td><td>${r.status==='pending'&&profile?.role==='admin'?`<button type="button" data-refund-action="approve" data-id="${r.id}">অনুমোদন করুন</button> <button type="button" class="danger" data-refund-action="reject" data-id="${r.id}">প্রত্যাখ্যান</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="7">কোনো আবেদন নেই।</td></tr>'}</tbody></table></div></div>`+await pendingCollectionsPanel()}
async function pendingCollectionsPanel(){const snap=await getDocs(collection(db,'collections'));const rows=snap.docs.map(d=>({id:d.id,...d.data()})).filter(r=>!['approved','rejected'].includes(r.status)).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));return `<div class="panel"><h2>কালেকশন অনুমোদন</h2><p>শুধু Admin অপেক্ষমাণ কালেকশন অনুমোদন বা প্রত্যাখ্যান করতে পারবেন।</p><div class="table-wrap"><table><thead><tr><th>তারিখ</th><th>সদস্য নম্বর</th><th>নাম</th><th>আদায়</th><th>কর্মী</th><th>কাজ</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${safe(r.date||'—')}</td><td>${safe(r.memberNo||'—')}</td><td>${safe(r.memberName||'—')}</td><td>${money(r.amount||0)}</td><td>${safe(r.createdByEmail||'—')}</td><td>${profile?.role==='admin'?`<button type="button" data-collection-action="approve" data-id="${r.id}">অনুমোদন করুন</button> <button type="button" class="danger" data-collection-action="reject" data-id="${r.id}">প্রত্যাখ্যান</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="6">কোনো অপেক্ষমাণ কালেকশন নেই।</td></tr>'}</tbody></table></div></div>`}
async function decideRefund(id,decision){if(profile?.role!=='admin')throw new Error('শুধু Admin আবেদন অনুমোদন বা প্রত্যাখ্যান করতে পারবেন।');const requestRef=doc(db,'refundRequests',id);const before=await getDoc(requestRef);if(!before.exists())throw new Error('আবেদনটি পাওয়া যায়নি।');const req=before.data();if(req.status!=='pending')throw new Error('এই আবেদন ইতিমধ্যে নিষ্পত্তি হয়েছে।');if(decision==='reject'){await runTransaction(db,async t=>{const rs=await t.get(requestRef);if(!rs.exists()||rs.data().status!=='pending')throw new Error('আবেদনটি ইতিমধ্যে নিষ্পত্তি হয়েছে।');t.update(requestRef,{status:'rejected',rejectedAt:serverTimestamp(),rejectedBy:currentUser.uid});});showNotice('আবেদন প্রত্যাখ্যান করা হয়েছে।');await renderPage();return}const memberNo=String(req.memberNo||'').trim(),amount=Number(req.amount||0);if(!memberNo)throw new Error('আবেদনে সদস্য নম্বর নেই।');if(!Number.isFinite(amount)||amount<=0)throw new Error('আবেদনের পরিমাণ সঠিক নয়।');const seedBalance=await calculateLegacyBalance(memberNo);const balanceRef=doc(db,'savingsBalances',balanceId(memberNo));const txRef=doc(collection(db,'savingsTransactions'));await runTransaction(db,async t=>{const [rs,bs]=await Promise.all([t.get(requestRef),t.get(balanceRef)]);if(!rs.exists()||rs.data().status!=='pending')throw new Error('আবেদনটি ইতিমধ্যে নিষ্পত্তি হয়েছে।');const current=bs.exists()?Number(bs.data().balance||0):seedBalance;if(amount>current)throw new Error('সঞ্চয় ব্যালেন্স অপর্যাপ্ত। বর্তমান ব্যালেন্স: '+money(current));t.set(balanceRef,{memberNo,memberName:req.memberName||'',balance:current-amount,updatedAt:serverTimestamp(),updatedBy:currentUser.uid});t.set(txRef,{memberNo,memberName:req.memberName||'',amount,type:'refund',date:req.date||dateNow(),reason:req.reason||'',receiptNo:req.receiptNo||'',status:'approved',refundRequestId:id,createdAt:serverTimestamp(),createdBy:currentUser.uid,createdByEmail:currentUser.email});t.update(requestRef,{status:'approved',approvedAt:serverTimestamp(),approvedBy:currentUser.uid,approvedAmount:amount});});showNotice('আবেদন অনুমোদিত হয়েছে এবং ব্যালেন্স আপডেট হয়েছে।');await renderPage()}

function bindForms(){document.querySelectorAll('.dataForm').forEach(f=>{const no=f.querySelector('[name="memberNo"]');if(no){if(currentPage==='collection'){const lookup=()=>{if(no.value.trim())lookupMemberLoansForCollection(f,no.value);};no.addEventListener('change',lookup);no.addEventListener('blur',lookup);}const details=document.createElement('div');details.className='memberLookupDetails';no.parentElement.insertAdjacentElement('afterend',details);no.addEventListener('change',()=>fillMemberDetails(f,no.value));no.addEventListener('blur',()=>{if(no.value.trim())fillMemberDetails(f,no.value)});}const pc=f.querySelector('[name="productCode"]'),pn=f.querySelector('[name="productName"]');if(pc||pn){const details=document.createElement('div');details.className='productLookupDetails';(pn||pc).parentElement.insertAdjacentElement('afterend',details);[pc,pn].filter(Boolean).forEach(el=>{el.addEventListener('change',()=>lookupProduct(f,el.value,el.name));el.addEventListener('blur',()=>{if(el.value.trim())lookupProduct(f,el.value,el.name)})})}const inv=f.querySelector('[name="invoiceNo"]');if(inv&&f.querySelector('.invoiceLookupDetails')){inv.addEventListener('change',()=>lookupSaleInvoice(f,inv.value));inv.addEventListener('blur',()=>{if(inv.value.trim())lookupSaleInvoice(f,inv.value)});}const recalc=()=>calculateLoanPreview(f);['deposit','installments','repaymentMode','installmentType'].forEach(n=>{const el=f.querySelector(`[name="${n}"]`);if(el){el.addEventListener('input',recalc);el.addEventListener('change',recalc)}});const mode=f.querySelector('[name="repaymentMode"]');if(mode){const applyMode=()=>{const cash=mode.value==='cash';['installmentType','installments'].forEach(n=>{const el=f.querySelector(`[name="${n}"]`);if(el){el.disabled=cash;el.required=!cash}});recalc()};mode.addEventListener('change',applyMode);applyMode()}f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('button[type="submit"],button');b.disabled=true;try{const result=await f._save(f);showNotice(typeof result==='string'?result:'তথ্য Firestore-এ সংরক্ষিত হয়েছে।');await renderPage()}catch(err){showNotice('সংরক্ষণ করা যায়নি: '+err.message,true)}finally{b.disabled=false}}});const dvsf=document.querySelector('#dayVillageScheduleForm');if(dvsf)dvsf.onsubmit=async e=>{e.preventDefault();if(profile?.role!=='admin'){showMsg($('dayVillageScheduleMsg'),'শুধু অ্যাডমিন সেটিংস পরিবর্তন করতে পারবেন।',true);return}const b=dvsf.querySelector('button');b.disabled=true;try{const schedule={};for(const d of ['Saturday','Sunday','Monday','Tuesday','Wednesday','Thursday','Friday'])schedule[d]=String(new FormData(dvsf).get(d)||'');await setDoc(doc(db,'settings','dayVillageSchedule'),{schedule,updatedAt:serverTimestamp(),updatedBy:currentUser.uid},{merge:true});showMsg($('dayVillageScheduleMsg'),'দিন ও গ্রামের সেটিংস সংরক্ষণ হয়েছে।',false)}catch(err){showMsg($('dayVillageScheduleMsg'),'সংরক্ষণ করা যায়নি: '+err.message,true)}finally{b.disabled=false}};const pf=document.querySelector('#passwordForm');if(pf)pf.onsubmit=async e=>{e.preventDefault();const b=pf.querySelector('button');b.disabled=true;try{const msg=await changePassword(pf);showMsg($('passwordMsg'),msg,false);pf.reset()}catch(err){showMsg($('passwordMsg'),'পাসওয়ার্ড পরিবর্তন হয়নি: '+err.message,true)}finally{b.disabled=false}};const wf=document.querySelector('#workerForm');if(wf)wf.onsubmit=async e=>{e.preventDefault();const b=wf.querySelector('button');b.disabled=true;try{const msg=await createWorker(wf);showMsg($('workerMsg'),msg,false);wf.reset();await renderWorkers()}catch(err){showMsg($('workerMsg'),'কর্মী তৈরি হয়নি: '+err.message,true)}finally{b.disabled=false}};const af=document.querySelector('#adminSetupForm');if(af)af.onsubmit=async e=>{e.preventDefault();if(!confirm('নিশ্চিত? নতুন অ্যাডমিন তৈরি হলে আপনার বর্তমান অ্যাকাউন্ট নিষ্ক্রিয় হবে।'))return;const b=af.querySelector('button');b.disabled=true;try{const msg=await setupAdminUsername(af);showMsg($('adminSetupMsg'),msg,false);setTimeout(()=>signOut(auth),1800)}catch(err){showMsg($('adminSetupMsg'),'সেটআপ হয়নি: '+err.message,true)}finally{b.disabled=false}};if(document.querySelector('#workerList')){renderWorkers();const mount=document.querySelector('#adminStaffReportMount');if(mount)renderStaffReport(true,'').then(x=>{mount.innerHTML=x;const rf=mount.querySelector('#staffReportForm');if(rf)rf.onsubmit=async e=>{e.preventDefault();const d=new FormData(rf),target=mount.querySelector('#staffReportResults');target.innerHTML='<p>রিপোর্ট তৈরি হচ্ছে…</p>';try{await loadStaffReport(target,String(d.get('staffId')||''),String(d.get('from')||''),String(d.get('to')||''),true)}catch(err){target.innerHTML='<div class="msg error">রিপোর্ট তৈরি হয়নি: '+safe(err.message)+'</div>'}}}).catch(err=>{if(mount)mount.innerHTML='<p class="msg error">রিপোর্ট লোড হয়নি: '+safe(err.message)+'</p>'})}document.querySelectorAll('[data-copy-invoice]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copyInvoice);showNotice('ইনভয়েস নম্বর কপি হয়েছে: '+b.dataset.copyInvoice)}catch{showNotice('ইনভয়েস নম্বর কপি করা যায়নি। নম্বরটি হাতে কপি করুন: '+b.dataset.copyInvoice,true)}})}function showNotice(s,err=false){showMsg($('notice'),s,err)}

</div><div class="amount">জমা: '+money(r.amount)+'</div><div class="sign"><span>জমাদাতার স্বাক্ষর</span><span>গ্রহণকারীর স্বাক্ষর</span></div><div class="foot">রশিদটি সংরক্ষণ করুন।</div><script>window.onload=()=>setTimeout(()=>window.print(),300)<\/script></body></html>';w.document.open();w.document.write(html);w.document.close()}catch(e){w.document.body.innerHTML='<p>রশিদ তৈরি হয়নি: '+safe(e.message)+'</p>'}};
window.printSaleInvoice=async function(invoiceNo){const w=window.open('','_blank','width=800,height=700');if(!w){showNotice('প্রিন্টের জন্য ব্রাউজারে Pop-ups অনুমতি দিন।',true);return}w.document.write('<p style="font-family:Arial;padding:24px">ইনভয়েস প্রস্তুত হচ্ছে…</p>');try{const snap=await getDocs(collection(db,'sales'));const sale=snap.docs.map(d=>({id:d.id,...d.data()})).find(x=>String(x.invoiceNo||'')===String(invoiceNo));if(!sale)throw new Error('ইনভয়েস পাওয়া যায়নি');const html='<!doctype html><html lang="bn"><head><meta charset="utf-8"><title>ইনভয়েস '+safe(sale.invoiceNo)+'</title><style>body{font-family:Arial,"Noto Sans Bengali",sans-serif;padding:24px;color:#111}h2,p{text-align:center}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{border:1px solid #777;padding:9px;text-align:left}.total{text-align:right;font-size:18px;line-height:1.8;margin-top:20px}.sign{display:flex;justify-content:space-between;margin-top:70px}</style></head><body><h2>স্বপ্নচূড়া পণ্য ঋণ বিতরণ সমিতি</h2><p>বিক্রয় ইনভয়েস</p><p style="text-align:left">ইনভয়েস: '+safe(sale.invoiceNo)+'<br>তারিখ: '+safe(sale.date||'')+'<br>সদস্য: '+safe(sale.memberName||'')+' ('+safe(sale.memberNo||'')+')</p><table><tr><th>পণ্য</th><th>পরিমাণ</th><th>একক মূল্য</th><th>মোট</th></tr><tr><td>'+safe(sale.productName||'')+'</td><td>'+safe(sale.quantity||0)+'</td><td>'+money(sale.price)+'</td><td>'+money(sale.total)+'</td></tr></table><div class="total">মোট: '+money(sale.total)+'<br>অগ্রিম: '+money(sale.deposit)+'<br>বাকি: '+money(sale.balance)+'</div><div class="sign"><span>ক্রেতার স্বাক্ষর: __________</span><span>কর্তৃপক্ষের স্বাক্ষর: __________</span></div><script>window.onload=()=>setTimeout(()=>window.print(),250)<\/script></body></html>';w.document.open();w.document.write(html);w.document.close()}catch(e){w.document.body.innerHTML='<p>ইনভয়েস তৈরি হয়নি: '+safe(e.message)+'</p>'}};
async function listTable(coll,cols){let snap=await getDocs(query(collection(db,coll),orderBy('createdAt','desc'),limit(100)));let rows=snap.docs.map(d=>({id:d.id,...d.data()}));return `<div class="panel"><div class="section-head"><h2>${labels[coll]||coll}</h2><button class="secondary" onclick="window.print()">প্রিন্ট</button></div><div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th>${safe(c[1])}</th>`).join('')}${coll==='sales'?'<th>ইনভয়েস</th>':(coll==='collections'||coll==='savingsTransactions')?'<th>প্রিন্ট</th>':''}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${safe(c[2]?c[2](r):r[c[0]]??'')}</td>`).join('')}${coll==='sales'?`<td><button type="button" class="secondary" data-print-invoice="${safe(r.invoiceNo||'')}">🖨️ প্রিন্ট</button> <button type="button" class="secondary" data-copy-invoice="${safe(r.invoiceNo||'')}">কপি</button></td>`:coll==='collections'?`<td><button type="button" class="secondary" data-print-collection="${safe(r.id)}">🖨️ রশিদ</button></td>`:coll==='savingsTransactions'&&r.type==='deposit'?`<td><button type="button" class="secondary" data-print-deposit="${safe(r.id)}">🖨️ জমা ভাউচার</button></td>`:coll==='savingsTransactions'?'<td>—</td>':''}</tr>`).join('')||`<tr><td colspan="${cols.length+(['sales','collections','savingsTransactions'].includes(coll)?1:0)}">এখনো কোনো তথ্য নেই</td></tr>`}</tbody></table></div></div>`}
function homePage(){const icons={dashboard:'📊',villages:'🏘️',memberTransfer:'🔄',settings:'⚙️',members:'👥',passbook:'📘',statement:'📄',savingsAccount:'💳',deposit:'💰',refund:'↩️',products:'📦',productGroups:'🗂️',brands:'🏷️',purchase:'🛒',sale:'🧾',returns:'📤',service:'🛠️',payroll:'👨‍💼',loans:'🏦',collection:'🤝',dailySheet:'📋',approvals:'✅',reports:'📈'};return `<div class="panel"><div class="home-title"><div><h2>স্বপ্নচূড়া সমিতি — হোমপেজ</h2><p class="small">যে কাজটি করতে চান, তার আইকনে চাপ দিন।</p></div><span class="pill ok">সিস্টেম প্রস্তুত</span></div></div><div class="home-tiles">${menus.filter(([k])=>k==='home'?false:k==='staffReport'?profile?.role==='staff':k==='settings'||k==='dashboard'||(k==='dailySheet'?(can('collection')||can('reports')):can(k))).map(([k,t])=>`<button type="button" class="home-tile" data-home-page="${k}"><span class="tile-icon">${icons[k]||'📁'}</span><span class="tile-title">${t}</span></button>`).join('')}</div>`}
async function dashboard(){const counts={};const docs={};for(const c of ['members','savingsTransactions','loans','products','refundRequests','collections','sales','returns','villages']){try{const snap=await getDocs(query(collection(db,c),limit(2000)));docs[c]=snap.docs.map(d=>({id:d.id,...d.data()}));counts[c]=snap.size}catch{docs[c]=[];counts[c]='—'}}const sum=(arr,fn)=>arr.reduce((n,x)=>n+Number(fn(x)||0),0);const loans=docs.loans||[],approvedCollections=(docs.collections||[]).filter(x=>x.status!=='rejected'&&x.status!=='pending');const totalDisbursed=sum(loans,x=>x.principal);const totalRecovered=sum(approvedCollections,x=>x.amount);const outstanding=Math.max(0,totalDisbursed-totalRecovered-sum(loans,x=>x.waivedAmount||0));const salesTotal=sum(docs.sales||[],x=>x.total);const returnTotal=sum(docs.returns||[],x=>x.amount||x.total);const lowStock=(docs.products||[]).filter(p=>Number(p.quantity||0)<=Number(p.minStock||0));return `<div class="stats">${[['members','মোট সদস্য'],['villages','মোট গ্রাম'],['products','পণ্য'],['sales','বিক্রয় ইনভয়েস'],['loans','ঋণ রেকর্ড'],['collections','কিস্তি কালেকশন']].map(([k,t])=>`<div class="stat"><span>${t}</span><strong>${counts[k]}</strong></div>`).join('')}<div class="stat"><span>মোট ঋণ বিতরণ</span><strong>${money(totalDisbursed)}</strong></div><div class="stat"><span>ঋণ আদায়</span><strong>${money(totalRecovered)}</strong></div><div class="stat"><span>বর্তমান আনুমানিক বকেয়া ঋণ</span><strong>${money(outstanding)}</strong></div><div class="stat"><span>মোট বিক্রয়</span><strong>${money(salesTotal)}</strong></div><div class="stat"><span>বিক্রয় রিটার্ন</span><strong>${money(returnTotal)}</strong></div><div class="stat"><span>কম স্টকের পণ্য</span><strong>${lowStock.length}</strong></div></div><div class="dash-grid"><div class="dash-card"><h3>📊 সমিতির সারসংক্ষেপ</h3><div class="metric-row"><div class="metric"><span>মোট সদস্য</span><b>${counts.members}</b></div><div class="metric"><span>মোট গ্রাম</span><b>${counts.villages}</b></div><div class="metric"><span>মোট ঋণ বিতরণ</span><b>${money(totalDisbursed)}</b></div><div class="metric"><span>মোট আদায়</span><b>${money(totalRecovered)}</b></div></div></div><div class="dash-card"><h3>📈 কার্যক্রমের তুলনা</h3><div class="mini-bars">${[['সদস্য',counts.members],['গ্রাম',counts.villages],['ঋণ',loans.length],['আদায়',approvedCollections.length]].map(([label,val])=>{const n=Number(val)||0,max=Math.max(1,Number(counts.members)||0,Number(counts.villages)||0,loans.length,approvedCollections.length);return `<div class="mini-bar"><i style="height:${Math.max(4,Math.round(n/max*88))}px"></i><small>${label}</small><small>${n}</small></div>`}).join('')}</div><div class="chart-legend"><span>লাইভ Firestore তথ্যের ভিত্তিতে</span></div></div></div>${lowStock.length?`<div class="panel"><h2>⚠️ কম স্টকের সতর্কতা</h2><div class="table-wrap"><table><thead><tr><th>পণ্য</th><th>বর্তমান স্টক</th><th>সতর্ক সীমা</th></tr></thead><tbody>${lowStock.map(p=>`<tr><td>${safe(p.name||p.productName||'')}</td><td>${Number(p.quantity||0)}</td><td>${Number(p.minStock||0)}</td></tr>`).join('')}</tbody></table></div></div>`:''}<div class="panel"><h2>কাজের নির্দেশনা</h2><p>সমিতি ব্যবস্থাপনার জন্য গ্রাম ও সদস্য তৈরি করুন। পণ্য বিক্রির ইনভয়েস নম্বর দিয়ে ঋণ তৈরি করা যাবে; একই ইনভয়েসে একাধিক ঋণ তৈরি করা যাবে না।</p><p class="small">ড্যাশবোর্ডের মোট ঋণ বিতরণ ঋণের principal যোগ করে দেখায়। আদায় ও মওকুফের পুরোনো রেকর্ডের ধরন/সংযোগ একরকম না হলে বকেয়া অঙ্ক আনুমানিক হতে পারে; বাস্তব ব্যবহারের আগে ঋণ ও কালেকশন ডেটা মিলিয়ে পরীক্ষা করুন।</p></div>`}

function applyLanguage(root=document.body){if(currentLang!=='en')return;const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);for(const n of nodes){const raw=n.nodeValue,trim=raw.trim();if(!trim)continue;let replacement=enMap[trim];if(!replacement){for(const [bn,en] of Object.entries(enMap)){if(trim.startsWith(bn)&&trim.length>bn.length&&bn.endsWith(':')){replacement=en+trim.slice(bn.length);break}}}if(replacement)n.nodeValue=raw.replace(trim,replacement)}root.querySelectorAll('input[placeholder]').forEach(el=>{const t=el.getAttribute('placeholder');if(enMap[t])el.setAttribute('placeholder',enMap[t])});}
function refreshLanguage(){document.documentElement.lang=currentLang==='en'?'en':'bn';updateHeaderDate();$('langToggle').textContent=currentLang==='en'?'বাংলা':'English';try{localStorage.setItem('samitiLang',currentLang)}catch{}applyLanguage(document.body);if(profile){renderNav();renderPage()}}
$('langToggle').addEventListener('click',()=>{currentLang=currentLang==='bn'?'en':'bn';try{localStorage.setItem('samitiLang',currentLang)}catch{}window.location.reload()});

async function loadStaffReport(target,staffId,from,to,isAdmin){
 if(!staffId)throw new Error('কর্মী নির্বাচন করুন।');if(from>to)throw new Error('শুরুর তারিখ শেষ তারিখের পরে হতে পারবে না।');
 const [ls,cs,us]=await Promise.all([getDocs(collection(db,'loans')),getDocs(collection(db,'collections')),isAdmin?getDocs(collection(db,'users')):Promise.resolve(null)]);
 const loans=ls.docs.map(d=>({id:d.id,...d.data()})).filter(x=>String(x.createdBy||'')===staffId&&String(x.startDate||x.date||'')>=from&&String(x.startDate||x.date||'')<=to);
 const allStaffLoans=ls.docs.map(d=>({id:d.id,...d.data()})).filter(x=>String(x.createdBy||'')===staffId);
 const allLoanNos=new Set(allStaffLoans.map(x=>String(x.loanNo||x.id)));
 const collections=cs.docs.map(d=>({id:d.id,...d.data()})).filter(x=>String(x.createdBy||'')===staffId&&String(x.date||x.paymentDate||'')>=from&&String(x.date||x.paymentDate||'')<=to&&x.status!=='pending'&&x.status!=='rejected');
 const sum=(arr,key)=>arr.reduce((n,x)=>n+Number(x[key]||0),0);
 const loanAmount=sum(loans,'principal'),collected=sum(collections,'amount');
 const allRecovered=cs.docs.map(d=>d.data()).filter(x=>allLoanNos.has(String(x.loanNo||''))&&x.status!=='pending'&&x.status!=='rejected').reduce((n,x)=>n+Number(x.amount||0),0);
 const allDisbursed=sum(allStaffLoans,'principal');const outstanding=Math.max(0,allDisbursed-allRecovered-allStaffLoans.reduce((n,x)=>n+Number(x.waivedAmount||0),0));
 let staffName='নিজের';if(isAdmin&&us){const u=us.docs.find(d=>d.id===staffId);if(u)staffName=u.data().name||u.data().username||u.data().email||staffId;}
 target.innerHTML=`<p><b>কর্মী:</b> ${safe(staffName)} | <b>সময়কাল:</b> ${safe(from)} — ${safe(to)}</p><div class="stats"><div class="stat"><span>এই সময়ে ঋণ বিতরণ</span><strong>${money(loanAmount)}</strong></div><div class="stat"><span>এই সময়ে অনুমোদিত কালেকশন</span><strong>${money(collected)}</strong></div><div class="stat"><span>বর্তমান বকেয়া (কর্মীর ঋণ)</span><strong>${money(outstanding)}</strong></div></div><h3>ঋণ বিতরণের তালিকা</h3><div class="table-wrap"><table><thead><tr><th>তারিখ</th><th>ঋণ নম্বর</th><th>সদস্য</th><th>ঋণ বিতরণ</th></tr></thead><tbody>${loans.map(x=>`<tr><td>${safe(x.startDate||x.date||'—')}</td><td>${safe(x.loanNo||'—')}</td><td>${safe(x.memberName||'')} (${safe(x.memberNo||'')})</td><td>${money(x.principal)}</td></tr>`).join('')||'<tr><td colspan="4">এই সময়ে ঋণ বিতরণ নেই।</td></tr>'}</tbody></table></div><h3>কালেকশনের তালিকা</h3><div class="table-wrap"><table><thead><tr><th>তারিখ</th><th>ঋণ নম্বর</th><th>সদস্য</th><th>আদায়</th><th>অবস্থা</th></tr></thead><tbody>${collections.map(x=>`<tr><td>${safe(x.date||x.paymentDate||'—')}</td><td>${safe(x.loanNo||'—')}</td><td>${safe(x.memberName||'')} (${safe(x.memberNo||'')})</td><td>${money(x.amount)}</td><td>${safe(x.status||'approved')}</td></tr>`).join('')||'<tr><td colspan="5">এই সময়ে অনুমোদিত কালেকশন নেই।</td></tr>'}</tbody></table></div><p class="small">বকেয়া = নির্বাচিত কর্মীর তৈরি সব ঋণের মূলধন − ওই ঋণগুলোর অনুমোদিত কালেকশন। পুরোনো রেকর্ডে createdBy বা loanNo না থাকলে হিসাব অসম্পূর্ণ হতে পারে।</p>`;
}
async function renderInstallmentAlertsPage(){
 const today=dateNow();
 const plusDays=(date,n)=>{const d=new Date(String(date||'')+'T12:00:00');if(Number.isNaN(d.getTime()))return '';d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
 const fmtDate=d=>{if(!d)return 'তারিখ নির্ধারিত নয়';const a=d.split('-');return a.length===3?`${a[2]}-${a[1]}-${a[0]}`:d};
 const [ls,cs,ms]=await Promise.all([getDocs(collection(db,'loans')),getDocs(collection(db,'collections')),getDocs(collection(db,'members'))]);
 const loans=ls.docs.map(x=>({id:x.id,...x.data()}));
 const cols=cs.docs.map(x=>x.data()).filter(x=>x.status!=='rejected'&&x.status!=='pending');
 const members=ms.docs.map(x=>x.data());
 const memberFor=l=>members.find(m=>normalizeDigits(m.memberNo||'')===normalizeDigits(l.memberNo||''))||{};
 const alerts=[];
 for(const l of loans){
   if(!l.startDate||!l.installmentAmount||Number(l.installments||0)<=0||l.status==='rejected')continue;
   const paid=cols.filter(c=>String(c.loanNo||'')===String(l.loanNo||l.id)).reduce((n,c)=>n+Number(c.amount||0),0);
   const principal=Number(l.principal||0);const balance=Math.max(0,principal-paid);if(balance<=0)continue;
   const per=Math.max(0,Number(l.installmentAmount||0));if(!per)continue;
   const count=Math.max(1,Number(l.installments||1));
   const paidInstallments=Math.min(count,Math.floor((paid+0.00001)/per));
   const nextIndex=paidInstallments+1;
   if(nextIndex>count)continue;
   const interval=l.installmentType==='weekly'?7:30;
   const due=plusDays(l.startDate,(nextIndex-1)*interval);
   if(!due||due<today||due>plusDays(today,2))continue;
   const m=memberFor(l);const name=l.memberName||m.name||'সদস্য';const phone=l.phone||m.phone||'';
   const msg=`প্রিয় ${name}, আপনার সমিতির কিস্তি ${money(Math.min(per,balance))} টাকা ${fmtDate(due)} তারিখে জমা দেওয়ার নির্ধারিত সময়। অনুগ্রহ করে সময়মতো কিস্তি পরিশোধ করুন। ধন্যবাদ।`;
   alerts.push({name,memberNo:l.memberNo||m.memberNo||'',phone,loanNo:l.loanNo||l.id,due,amount:Math.min(per,balance),msg});
 }
 alerts.sort((a,b)=>a.due.localeCompare(b.due));
 return `<div class="panel"><h2>কিস্তি কালেকশন এলার্ট নোটিফিকেশন</h2><p>আজ থেকে আগামী ২ দিনের মধ্যে যেসব কিস্তির তারিখ পড়ে, সেগুলোর জন্য কপি করার মতো বার্তা এখানে দেখানো হবে।</p><p class="small">কিস্তির তারিখ ঋণের শুরুর তারিখ থেকে সাপ্তাহিক হলে ৭ দিন এবং মাসিক হলে ৩০ দিন ধরে হিসাব করা হচ্ছে।</p><div class="actions"><button type="button" class="secondary" id="refreshInstallmentAlerts">আবার লোড করুন</button></div></div><div class="panel"><h3>কিস্তি এলার্ট (${alerts.length})</h3>${alerts.length?`<div class="table-wrap"><table><thead><tr><th>নির্ধারিত তারিখ</th><th>সদস্য</th><th>মোবাইল</th><th>কিস্তি</th><th>বার্তা / কপি</th></tr></thead><tbody>${alerts.map((a,i)=>`<tr><td>${safe(fmtDate(a.due))}</td><td>${safe(a.name)}<br><small>${safe(a.memberNo)}</small></td><td>${safe(a.phone||'—')}</td><td>${money(a.amount)}</td><td><textarea readonly rows="3" id="installmentAlertMsg${i}" style="min-width:240px;width:100%">${safe(a.msg)}</textarea><button type="button" class="secondary" data-copy-installment-alert="${i}">বার্তা কপি করুন</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="msg">আগামী ২ দিনের মধ্যে নির্ধারিত কোনো কিস্তি পাওয়া যায়নি।</p>'}</div>`;
}
