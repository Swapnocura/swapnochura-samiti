.nav-label{display:none}.sidebar.collapsed .sidebar-head{justify-content:center}.sidebar.collapsed .nav button{font-size:0;text-align:center;padding:12px 4px}.sidebar.collapsed .nav button::first-letter{font-size:16px}.sidebar.collapsed .nav button{overflow:hidden}.sidebar.collapsed .nav button.active{font-size:0}.sidebar.collapsed .nav button[data-page]::before{content:attr(data-short);font-size:14px;font-weight:700}.top .user-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.top h1{font-size:20px;margin:0}.top small{opacity:.85}.wrap{max-width:1200px;margin:auto;padding:16px}.login{max-width:420px;margin:7vh auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 8px 30px #14233a12}.login h2{margin-top:0}.field{display:flex;flex-direction:column;gap:5px;margin:10px 0}.field label{font-size:14px;font-weight:650}.field input,.field select,.field textarea{border:1px solid #cbd5e1;border-radius:9px;padding:11px;background:#fff;width:100%;min-width:0}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}.nav button{background:#e3eaf5;color:#1b3555}.nav button.active{background:var(--brand);color:#fff}.panel,.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}.panel h2{font-size:19px;margin:0 0 12px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}.stat span{display:block;color:var(--muted);font-size:13px}.stat strong{font-size:24px;display:block;margin-top:5px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.msg{padding:10px 12px;border-radius:9px;background:#eef4ff;margin:10px 0;color:#173c72;white-space:pre-wrap}.error{background:#fff0ef;color:var(--danger)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:10px 8px;font-size:14px}th{background:#f7f9fc}.pill{border-radius:99px;padding:3px 8px;background:#fff2cc;color:#7a4d00;font-size:12px}.pill.ok{background:#dcfae6;color:#05603a}.small{font-size:12px;color:var(--muted)}.section-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.foot{color:var(--muted);font-size:12px;text-align:center;padding:22px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:760px){.app-layout{gap:8px}.sidebar{width:205px;flex-basis:205px;padding:8px}.sidebar.collapsed{width:54px;flex-basis:54px}.sidebar .nav button{font-size:13px;padding:10px 8px}.sidebar.collapsed .nav button{font-size:0}.main-content{min-width:0}.wrap{padding:10px}.top{padding:12px}.top h1{font-size:16px}}@media(max-width:480px){.app-layout{gap:7px}.sidebar{width:168px;flex-basis:168px}.sidebar.collapsed{width:48px;flex-basis:48px}.sidebar-head{gap:5px}.menu-toggle{width:36px;height:38px;flex-basis:36px}.sidebar-brand{font-size:14px}.sidebar .nav button{font-size:12px;padding:9px 6px}.sidebar.collapsed .nav button{font-size:0}.row2{grid-template-columns:1fr}.panel{padding:10px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat strong{font-size:20px}}
@media(max-width:760px){.app-layout{display:block;position:relative}.sidebar{position:fixed;z-index:100;left:0;top:0;bottom:0;width:260px;max-height:100vh;border-radius:0 14px 14px 0;box-shadow:0 12px 40px #10243a33;transition:width .18s ease}.sidebar.collapsed{transform:none;width:54px;flex-basis:54px;padding:10px}.sidebar.collapsed .sidebar-brand,.sidebar.collapsed .sidebar-sub,.sidebar.collapsed .nav{display:none}.sidebar.collapsed .sidebar-head{justify-content:center}.sidebar.collapsed .menu-toggle{width:36px;height:38px;flex-basis:36px}.sidebar:not(.collapsed) .sidebar-brand,.sidebar:not(.collapsed) .sidebar-sub,.sidebar:not(.collapsed) .nav-label{display:block}.sidebar:not(.collapsed) .sidebar-head{justify-content:flex-start}.sidebar:not(.collapsed) .nav button{font-size:13px;text-align:left;padding:11px 12px}.sidebar:not(.collapsed) .nav button::before{content:none}.main-content{width:calc(100% - 60px);margin-left:60px}.top{padding-left:60px}.menu-toggle{position:relative;z-index:101}}</style>

<body>
<header class="top"><div class="brand-lockup"><img class="brand-logo" src="./logo.png" alt="স্বপ্নচূড়া লোগো" onerror="this.style.display='none'"><div class="brand-heading"><h1>স্বপ্নচূড়া পণ্য ঋণ বিতরণ সমিতি</h1><small>Admin Panel · MVP</small></div></div><div id="userbar" class="hidden"><span id="who"></span> <button id="logout" class="secondary">লগআউট</button></div></header>
<main class="wrap">
<section id="loginBox" class="login"><h2>লগইন</h2><p class="small">Admin বা অনুমোদিত কর্মীর ইমেইল ও পাসওয়ার্ড ব্যবহার করুন। এখানে নতুন অ্যাকাউন্ট তৈরি করা যায় না।</p><form id="loginForm"><div class="field"><label>ইমেইল</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>পাসওয়ার্ড</label><input id="password" type="password" autocomplete="current-password" required></div><button type="submit" style="width:100%">লগইন</button></form><div id="loginMsg" class="msg hidden"></div></section>
<section id="appBox" class="hidden">
<div class="app-layout">
<aside id="sidebar" class="sidebar">
<div class="sidebar-head"><button id="menuToggle" class="menu-toggle" type="button" aria-label="মেনু খুলুন বা বন্ধ করুন" title="মেনু খুলুন বা বন্ধ করুন">☰</button><div><div class="sidebar-brand">স্বপ্নচূড়া</div><div class="sidebar-sub">সমিতি ব্যবস্থাপনা</div></div></div>
<nav class="nav" id="nav"></nav>
</aside>
<div class="main-content"><div id="notice" class="msg hidden"></div><section id="view"></section></div>
</div>
</section>
<div class="foot">প্রাথমিক MVP · বাস্তব সদস্যের আর্থিক তথ্য ব্যবহারের আগে নিরাপত্তা, হিসাব ও অনুমোদন পরীক্ষা করুন।</div>
</main>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js';
import { getFirestore, doc, getDoc, collection, addDoc, getDocs, query, orderBy, limit, serverTimestamp, runTransaction } from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js';
const firebaseConfig = {
  apiKey: "AIzaSyA4qNbtQDDfXvPbeQGhMUcLDPGG9rIEeGs",
  authDomain: "swapnochura-samiti.firebaseapp.com",
  projectId: "swapnochura-samiti",
  storageBucket: "swapnochura-samiti.firebasestorage.app",
  messagingSenderId: "416130328900",
  appId: "1:416130328900:web:5b2eef0c26e7d2315b4f11"
};
const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);
const $=id=>document.getElementById(id);let currentUser=null, profile=null, currentPage='dashboard';
const menus=[['dashboard','ড্যাশবোর্ড'],['members','সদস্য ভর্তি / তালিকা'],['passbook','সদস্য পাসবই'],['savingsAccount','নতুন সঞ্চয় হিসাব'],['deposit','সঞ্চয় জমা'],['refund','সঞ্চয় ফেরত'],['products','পণ্য তালিকা'],['purchase','পণ্য ক্রয়'],['sale','পণ্য বিক্রয়'],['loans','ঋণ বিতরণ / তালিকা'],['collection','কিস্তি কালেকশন'],['approvals','অনুমোদন'],['reports','রিপোর্ট']];
const labels={members:'সদস্য',savingsAccounts:'সঞ্চয় হিসাব',savingsTransactions:'সঞ্চয় লেনদেন',refundRequests:'সঞ্চয় ফেরতের আবেদন',products:'পণ্য',purchases:'পণ্য ক্রয়',sales:'পণ্য বিক্রয়',loans:'ঋণ',collections:'কিস্তি কালেকশন',receipts:'রসিদ'};
function safe(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(v){return '৳'+Number(v||0).toLocaleString('en-BD',{maximumFractionDigits:2})}function dateNow(){return new Date().toISOString().slice(0,10)}function showMsg(el,msg,isError=false){el.textContent=msg;el.classList.remove('hidden');el.classList.toggle('error',isError)}function can(key){return profile?.role==='admin'||profile?.permissions?.[key]===true}
function renderNav(){ $('nav').innerHTML=menus.filter(([k])=>k==='dashboard'||can(k)).map(([k,t])=>`<button data-page="${k}" data-short="${t.slice(0,1)}" class="${currentPage===k?'active':''}"><span class="nav-label">${t}</span></button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{currentPage=b.dataset.page;renderNav();renderPage()})}
$('menuToggle').addEventListener('click',()=>{$('sidebar').classList.toggle('collapsed')});
function field(name,label,type='text',required=true,opts=null){if(opts)return `<div class="field"><label>${label}</label><select name="${name}" ${required?'required':''}>${opts.map(o=>`<option value="${safe(o[0])}">${safe(o[1])}</option>`).join('')}</select></div>`;return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" ${type==='number'?'min="0" step="0.01"':''} ${required?'required':''}></div>`}
function formBox(title,fields,button='সংরক্ষণ'){return `<div class="panel"><h2>${title}</h2><form class="dataForm">${fields.join('')}<div class="actions"><button>${button}</button></div></form></div>`}
async function saveForm(form,coll,extra={}){const fd=new FormData(form),data={...extra};for(const [k,v] of fd.entries())data[k]=v;if(data.amount!==undefined)data.amount=Number(data.amount);if(data.quantity!==undefined)data.quantity=Number(data.quantity);if(data.price!==undefined)data.price=Number(data.price);if(data.costPrice!==undefined)data.costPrice=Number(data.costPrice);if(data.salePrice!==undefined)data.salePrice=Number(data.salePrice);if(data.installments!==undefined)data.installments=Number(data.installments);data.createdAt=serverTimestamp();data.createdBy=currentUser.uid;data.createdByEmail=currentUser.email;await addDoc(collection(db,coll),data);return true}
function balanceId(memberNo){return encodeURIComponent(String(memberNo||'').trim())}
async function calculateLegacyBalance(memberNo){const snap=await getDocs(collection(db,'savingsTransactions'));let total=0;for(const d of snap.docs){const r=d.data();if(String(r.memberNo||'').trim()!==String(memberNo||'').trim()||r.status!=='approved')continue;const a=Number(r.amount||0);if(r.type==='deposit')total+=a;else if(r.type==='refund')total-=a;}return Math.max(0,total)}
async function recordSavingsMovement(raw,type){const data={...raw};data.memberNo=String(data.memberNo||'').trim();data.memberName=String(data.memberName||'').trim();data.amount=Number(data.amount);if(!data.memberNo)throw new Error('সদস্য নম্বর দিন।');if(!Number.isFinite(data.amount)||data.amount<=0)throw new Error('পরিমাণ শূন্যের বেশি হতে হবে।');const seedBalance=await calculateLegacyBalance(data.memberNo);const balanceRef=doc(db,'savingsBalances',balanceId(data.memberNo));const txRef=doc(collection(db,'savingsTransactions'));await runTransaction(db,async t=>{const b=await t.get(balanceRef);const current=b.exists()?Number(b.data().balance||0):seedBalance;if(type==='refund'&&data.amount>current)throw new Error('সঞ্চয় ব্যালেন্স অপর্যাপ্ত। বর্তমান ব্যালেন্স: '+money(current));const next=type==='deposit'?current+data.amount:current-data.amount;t.set(balanceRef,{memberNo:data.memberNo,memberName:data.memberName,balance:next,updatedAt:serverTimestamp(),updatedBy:currentUser.uid});t.set(txRef,{...data,type,status:'approved',createdAt:serverTimestamp(),createdBy:currentUser.uid,createdByEmail:currentUser.email});});return true}
function passbookPage(){return `<div class="panel"><h2>সদস্য পাসবই</h2><p>সদস্য নম্বর বা নাম লিখে সম্পূর্ণ সঞ্চয় লেনদেন ও বর্তমান সঞ্চয় ব্যালেন্স দেখুন।</p><form id="passbookSearch" class="row2"><div class="field"><label>সদস্য নম্বর বা নাম</label><input name="term" required placeholder="যেমন: ০১ অথবা সদস্যের নাম"></div><div class="actions" style="align-items:end"><button type="submit">খুঁজুন</button></div></form><div id="passbookResults"><p class="small">সদস্য খুঁজতে নম্বর বা নাম লিখুন।</p></div></div>`}
async function renderPassbook(term){const out=$('passbookResults');out.innerHTML='<p>খোঁজা হচ্ছে…</p>';const qtext=String(term||'').trim().toLocaleLowerCase('bn');if(!qtext){out.innerHTML='<p class="msg error">সদস্য নম্বর বা নাম লিখুন।</p>';return}const [ms,ts]=await Promise.all([getDocs(collection(db,'members')),getDocs(collection(db,'savingsTransactions'))]);const members=ms.docs.map(d=>({id:d.id,...d.data()}));const txs=ts.docs.map(d=>({id:d.id,...d.data()}));let found=members.filter(m=>String(m.memberNo||'').toLocaleLowerCase('bn').includes(qtext)||String(m.name||'').toLocaleLowerCase('bn').includes(qtext));if(!found.length){const txMembers=new Map();txs.filter(t=>String(t.memberNo||'').toLocaleLowerCase('bn').includes(qtext)||String(t.memberName||'').toLocaleLowerCase('bn').includes(qtext)).forEach(t=>txMembers.set(String(t.memberNo||t.memberName),{memberNo:t.memberNo||'',name:t.memberName||''}));found=[...txMembers.values()]}if(!found.length){out.innerHTML='<p class="msg">এই নামে বা নম্বরে কোনো সদস্য/লেনদেন পাওয়া যায়নি।</p>';return}const exact=found.length===1?found[0]:found.find(m=>String(m.memberNo||'').trim().toLocaleLowerCase('bn')===qtext)||found.find(m=>String(m.name||'').trim().toLocaleLowerCase('bn')===qtext);if(!exact){out.innerHTML='<div class="panel"><h3>একাধিক সদস্য পাওয়া গেছে</h3><p>সঠিক সদস্য নির্বাচন করতে নম্বরসহ অনুসন্ধান করুন:</p><div class="table-wrap"><table><thead><tr><th>সদস্য নম্বর</th><th>নাম</th><th>নির্বাচন</th></tr></thead><tbody>'+found.map(m=>`<tr><td>${safe(m.memberNo||'—')}</td><td>${safe(m.name||m.memberName||'—')}</td><td><button type="button" class="secondary" data-pb-select="${safe(m.memberNo||'')}" data-pb-name="${safe(m.name||m.memberName||'')}">দেখুন</button></td></tr>`).join('')+'</tbody></table></div></div>';out.querySelectorAll('[data-pb-select]').forEach(b=>b.onclick=()=>renderPassbook(b.dataset.pbSelect||b.dataset.pbName));return}const no=String(exact.memberNo||'').trim(),name=String(exact.name||exact.memberName||'').trim();const rows=txs.filter(t=>(no&&String(t.memberNo||'').trim()===no)||(!no&&name&&String(t.memberName||'').trim()===name)).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));let deposits=0,refunds=0;rows.forEach(r=>{if(r.status==='approved'&&r.type==='deposit')deposits+=Number(r.amount||0);if(r.status==='approved'&&r.type==='refund')refunds+=Number(r.amount||0)});out.innerHTML=`<div class="stats"><div class="stat"><span>সদস্য নম্বর</span><strong>${safe(no||'—')}</strong></div><div class="stat"><span>সদস্যের নাম</span><strong>${safe(name||'—')}</strong></div><div class="stat"><span>মোট অনুমোদিত জমা</span><strong>${money(deposits)}</strong></div><div class="stat"><span>মোট অনুমোদিত ফেরত</span><strong>${money(refunds)}</strong></div><div class="stat"><span>বর্তমান হিসাবি ব্যালেন্স</span><strong>${money(Math.max(0,deposits-refunds))}</strong></div></div><div class="panel"><div class="section-head"><h2>লেনদেনের বিবরণ</h2><button class="secondary" type="button" onclick="window.print()">প্রিন্ট</button></div><div class="table-wrap"><table><thead><tr><th>তারিখ</th><th>ধরন</th><th>পরিমাণ</th><th>রসিদ</th><th>অবস্থা</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${safe(r.date||'—')}</td><td>${safe(r.type==='deposit'?'সঞ্চয় জমা':r.type==='refund'?'সঞ্চয় ফেরত':r.type||'—')}</td><td>${money(r.amount)}</td><td>${safe(r.receiptNo||'—')}</td><td>${safe(r.status||'—')}</td></tr>`).join('')||'<tr><td colspan="5">এই সদস্যের কোনো লেনদেন নেই।</td></tr>'}</tbody></table></div></div>`}
async function approvalsPage(){const snap=await getDocs(collection(db,'refundRequests'));const rows=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>{const ap=a.status==='pending'?0:1,bp=b.status==='pending'?0:1;return ap-bp||String(b.date||'').localeCompare(String(a.date||''))});return `<div class="panel"><h2>সঞ্চয় ফেরতের অপেক্ষমাণ আবেদন</h2><p>অনুমোদনের সময় সদস্যের অনুমোদিত জমা থেকে অনুমোদিত ফেরত বাদ দিয়ে ব্যালেন্স যাচাই করা হবে। অনুমোদন ও ব্যালেন্স আপডেট একসঙ্গে সংরক্ষিত হবে।</p><div class="table-wrap"><table><thead><tr><th>সদস্য নম্বর</th><th>নাম</th><th>পরিমাণ</th><th>তারিখ</th><th>কারণ</th><th>অবস্থা</th><th>কাজ</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${safe(r.memberNo||'—')}</td><td>${safe(r.memberName||'—')}</td><td>${money(r.amount)}</td><td>${safe(r.date||'—')}</td><td>${safe(r.reason||'—')}</td><td>${safe(r.status||'pending')}</td><td>${r.status==='pending'&&profile?.role==='admin'?`<button type="button" data-refund-action="approve" data-id="${r.id}">অনুমোদন</button> <button type="button" class="danger" data-refund-action="reject" data-id="${r.id}">প্রত্যাখ্যান</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="7">কোনো আবেদন নেই।</td></tr>'}</tbody></table></div></div>`}
async function decideRefund(id,decision){if(profile?.role!=='admin')throw new Error('শুধু Admin আবেদন অনুমোদন বা প্রত্যাখ্যান করতে পারবেন।');const requestRef=doc(db,'refundRequests',id);const before=await getDoc(requestRef);if(!before.exists())throw new Error('আবেদনটি পাওয়া যায়নি।');const req=before.data();if(req.status!=='pending')throw new Error('এই আবেদন ইতিমধ্যে নিষ্পত্তি হয়েছে।');if(decision==='reject'){await runTransaction(db,async t=>{const rs=await t.get(requestRef);if(!rs.exists()||rs.data().status!=='pending')throw new Error('আবেদনটি ইতিমধ্যে নিষ্পত্তি হয়েছে।');t.update(requestRef,{status:'rejected',rejectedAt:serverTimestamp(),rejectedBy:currentUser.uid});});showNotice('আবেদন প্রত্যাখ্যান করা হয়েছে।');await renderPage();return}const memberNo=String(req.memberNo||'').trim(),amount=Number(req.amount||0);if(!memberNo)throw new Error('আবেদনে সদস্য নম্বর নেই।');if(!Number.isFinite(amount)||amount<=0)throw new Error('আবেদনের পরিমাণ সঠিক নয়।');const seedBalance=await calculateLegacyBalance(memberNo);const balanceRef=doc(db,'savingsBalances',balanceId(memberNo));const txRef=doc(collection(db,'savingsTransactions'));await runTransaction(db,async t=>{const [rs,bs]=await Promise.all([t.get(requestRef),t.get(balanceRef)]);if(!rs.exists()||rs.data().status!=='pending')throw new Error('আবেদনটি ইতিমধ্যে নিষ্পত্তি হয়েছে।');const current=bs.exists()?Number(bs.data().balance||0):seedBalance;if(amount>current)throw new Error('সঞ্চয় ব্যালেন্স অপর্যাপ্ত। বর্তমান ব্যালেন্স: '+money(current));t.set(balanceRef,{memberNo,memberName:req.memberName||'',balance:current-amount,updatedAt:serverTimestamp(),updatedBy:currentUser.uid});t.set(txRef,{memberNo,memberName:req.memberName||'',amount,type:'refund',date:req.date||dateNow(),reason:req.reason||'',receiptNo:req.receiptNo||'',status:'approved',refundRequestId:id,createdAt:serverTimestamp(),createdBy:currentUser.uid,createdByEmail:currentUser.email});t.update(requestRef,{status:'approved',approvedAt:serverTimestamp(),approvedBy:currentUser.uid,approvedAmount:amount});});showNotice('আবেদন অনুমোদিত হয়েছে এবং ব্যালেন্স আপডেট হয়েছে।');await renderPage()}

function bindForms(){document.querySelectorAll('.dataForm').forEach(f=>f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('button[type="submit"],button');b.disabled=true;try{await f._save(f);showNotice('তথ্য Firestore-এ সংরক্ষিত হয়েছে।');await renderPage()}catch(err){showNotice('সংরক্ষণ করা যায়নি: '+err.message,true)}finally{b.disabled=false}})}function showNotice(s,err=false){showMsg($('notice'),s,err)}
async function listTable(coll,cols){let snap=await getDocs(query(collection(db,coll),orderBy('createdAt','desc'),limit(100)));let rows=snap.docs.map(d=>({id:d.id,...d.data()}));return `<div class="panel"><div class="section-head"><h2>${labels[coll]||coll} — সাম্প্রতিক ১০০টি</h2><button class="secondary" onclick="window.print()">প্রিন্ট</button></div><div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th>${safe(c[1])}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${safe(c[2]?c[2](r):r[c[0]]??'—')}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${cols.length}">এখনো কোনো তথ্য নেই</td></tr>`}</tbody></table></div></div>`}
async function dashboard(){const counts={};for(const c of ['members','savingsTransactions','loans','products','refundRequests','collections']){try{const s=await getDocs(query(collection(db,c),limit(500)));counts[c]=s.size}catch{counts[c]='—'}}return `<div class="stats">${[['members','মোট সদস্য'],['savingsTransactions','সঞ্চয় লেনদেন'],['loans','ঋণ রেকর্ড'],['products','পণ্য'],['collections','কিস্তি কালেকশন'],['refundRequests','সঞ্চয় ফেরত আবেদন']].map(([k,t])=>`<div class="stat"><span>${t}</span><strong>${counts[k]}</strong></div>`).join('')}</div><div class="panel"><h2>কাজের নির্দেশনা</h2><p>প্রথমে সদস্য ভর্তি করুন। এরপর সঞ্চয় হিসাব, সঞ্চয় জমা, ঋণ ও পণ্যের তথ্য যোগ করুন।</p><p class="small">সদস্য পাসবইয়ে সদস্য নম্বর বা নাম দিয়ে সঞ্চয় লেনদেন খুঁজুন। সঞ্চয় ফেরত অনুমোদনের সময় ব্যালেন্স যাচাই হয়। পণ্য স্টক, ঋণের কিস্তি সূচি ও অন্যান্য আর্থিক রিপোর্ট এখনো পূর্ণাঙ্গ নয়।</p></div>`}

case'reports':html=`<div class="panel"><h2>রিপোর্ট</h2><p>প্রতিটি বিভাগের সাম্প্রতিক রেকর্ড নিচে দেখুন এবং ব্রাউজার থেকে প্রিন্ট করুন।</p><button onclick="window.print()">রিপোর্ট প্রিন্ট</button></div>`+await listTable('collections',[['memberNo','সদস্য নম্বর'],['memberName','সদস্য'],['amount','আদায়',r=>money(r.amount)],['date','তারিখ'],['paymentFor','ধরন']]);break;
default:html='<div class="panel">এই মেনু প্রস্তুত করা হচ্ছে।</div>'}
v.innerHTML=html;const f=v.querySelector('.dataForm');if(f&&typeof window.pendingSaveHandler==='function'){f._save=window.pendingSaveHandler;}window.pendingSaveHandler=null;bindForms();const pb=v.querySelector('#passbookSearch');if(pb)pb.onsubmit=async e=>{e.preventDefault();try{await renderPassbook(new FormData(pb).get('term'))}catch(err){$('passbookResults').innerHTML='<p class="msg error">তথ্য আনা যায়নি: '+safe(err.message)+'</p>'}};v.querySelectorAll('[data-refund-action]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await decideRefund(b.dataset.id,b.dataset.refundAction)}catch(err){showNotice('আবেদন নিষ্পত্তি হয়নি: '+err.message,true)}finally{b.disabled=false}});}catch(err){v.innerHTML=`<div class="panel"><h2>তথ্য লোড করা যায়নি</h2><p>${safe(err.message)}</p><p class="small">Firestore Rules, লগইন ও users/{uid} প্রোফাইল যাচাই করুন।</p></div>`}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);$('loginMsg').classList.add('hidden')}catch(err){showMsg($('loginMsg'),'লগইন হয়নি: '+err.message,true)}});$('logout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async user=>{currentUser=user;if(!user){profile=null;$('loginBox').classList.remove('hidden');$('appBox').classList.add('hidden');$('userbar').classList.add('hidden');return}try{const snap=await getDoc(doc(db,'users',user.uid));if(!snap.exists())throw new Error('আপনার users/'+user.uid+' প্রোফাইল নেই। Firebase Console → Firestore → users-এ Admin প্রোফাইল তৈরি করুন (README দেখুন)।');profile=snap.data();if(!['admin','staff'].includes(profile.role))throw new Error('আপনার role admin বা staff নয়।');$('loginBox').classList.add('hidden');$('appBox').classList.remove('hidden');$('userbar').classList.remove('hidden');$('who').textContent=(profile.name||user.email)+' · '+profile.role;if(window.innerWidth<=760)$('sidebar').classList.add('collapsed');renderNav();await renderPage()}catch(err){await signOut(auth);showMsg($('loginMsg'),err.message,true);$('loginBox').classList.remove('hidden')}});
</script>
