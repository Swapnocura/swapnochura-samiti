<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>স্বপ্নচূড়া সমিতি — Admin Panel</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#182230;--muted:#687386;--brand:#1457a6;--line:#dce3ed;--danger:#b42318;--ok:#067647}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;background:var(--brand);color:#fff;font-weight:650}button.secondary{background:#e8eef7;color:#20334e}button.danger{background:#b42318}.hidden{display:none!important}.top{background:#123f78;color:#fff;padding:15px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.top h1{font-size:20px;margin:0}.top small{opacity:.85}.wrap{max-width:1200px;margin:auto;padding:16px}.login{max-width:420px;margin:7vh auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 8px 30px #14233a12}.login h2{margin-top:0}.field{display:flex;flex-direction:column;gap:5px;margin:10px 0}.field label{font-size:14px;font-weight:650}.field input,.field select,.field textarea{border:1px solid #cbd5e1;border-radius:9px;padding:11px;background:#fff;width:100%;min-width:0}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}.nav button{background:#e3eaf5;color:#1b3555}.nav button.active{background:var(--brand);color:#fff}.panel,.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}.panel h2{font-size:19px;margin:0 0 12px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}.stat span{display:block;color:var(--muted);font-size:13px}.stat strong{font-size:24px;display:block;margin-top:5px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.msg{padding:10px 12px;border-radius:9px;background:#eef4ff;margin:10px 0;color:#173c72;white-space:pre-wrap}.error{background:#fff0ef;color:var(--danger)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:10px 8px;font-size:14px}th{background:#f7f9fc}.pill{border-radius:99px;padding:3px 8px;background:#fff2cc;color:#7a4d00;font-size:12px}.pill.ok{background:#dcfae6;color:#05603a}.small{font-size:12px;color:var(--muted)}.section-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.foot{color:var(--muted);font-size:12px;text-align:center;padding:22px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:600px){.row2{grid-template-columns:1fr}.wrap{padding:10px}.panel{padding:12px}}
</style>
</head>
<body>
<header class="top"><div><h1>স্বপ্নচূড়া পণ্য ঋণ বিতরণ সমিতি</h1><small>Admin Panel · MVP</small></div><div id="userbar" class="hidden"><span id="who"></span> <button id="logout" class="secondary">লগআউট</button></div></header>
<main class="wrap">
<section id="loginBox" class="login"><h2>লগইন</h2><p class="small">Admin বা অনুমোদিত কর্মীর ইমেইল ও পাসওয়ার্ড ব্যবহার করুন। এখানে নতুন অ্যাকাউন্ট তৈরি করা যায় না।</p><form id="loginForm"><div class="field"><label>ইমেইল</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>পাসওয়ার্ড</label><input id="password" type="password" autocomplete="current-password" required></div><button type="submit" style="width:100%">লগইন</button></form><div id="loginMsg" class="msg hidden"></div></section>
<section id="appBox" class="hidden">
<div id="notice" class="msg hidden"></div>
<nav class="nav" id="nav"></nav>
<section id="view"></section>
</section>
<div class="foot">প্রাথমিক MVP · বাস্তব সদস্যের আর্থিক তথ্য ব্যবহারের আগে নিরাপত্তা, হিসাব ও অনুমোদন পরীক্ষা করুন।</div>
</main>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js';
import { getFirestore, doc, getDoc, collection, addDoc, getDocs, query, orderBy, limit, serverTimestamp } from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js';
const firebaseConfig = {
  apiKey: "AIzaSyA4qNbtQDDfXvPbeQGhMUcLDPGG9rIEeGs",
  authDomain: "swapnochura-samiti.firebaseapp.com",
  projectId: "swapnochura-samiti",
  storageBucket: "swapnochura-samiti.firebasestorage.app",
  messagingSenderId: "416130328900",
  appId: "1:416130328900:web:5b2eef0c26e7d2315b4f11"
};
const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);
const $=id=>document.getElementById(id);let currentUser=null, profile=null, currentPage='dashboard';
const menus=[['dashboard','ড্যাশবোর্ড'],['members','সদস্য ভর্তি / তালিকা'],['passbook','সদস্য পাসবই'],['savingsAccount','নতুন সঞ্চয় হিসাব'],['deposit','সঞ্চয় জমা'],['refund','সঞ্চয় ফেরত'],['products','পণ্য তালিকা'],['purchase','পণ্য ক্রয়'],['sale','পণ্য বিক্রয়'],['loans','ঋণ বিতরণ / তালিকা'],['collection','কিস্তি কালেকশন'],['approvals','অনুমোদন'],['reports','রিপোর্ট']];
const labels={members:'সদস্য',savingsAccounts:'সঞ্চয় হিসাব',savingsTransactions:'সঞ্চয় লেনদেন',refundRequests:'সঞ্চয় ফেরতের আবেদন',products:'পণ্য',purchases:'পণ্য ক্রয়',sales:'পণ্য বিক্রয়',loans:'ঋণ',collections:'কিস্তি কালেকশন',receipts:'রসিদ'};
function safe(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(v){return '৳'+Number(v||0).toLocaleString('en-BD',{maximumFractionDigits:2})}function dateNow(){return new Date().toISOString().slice(0,10)}function showMsg(el,msg,isError=false){el.textContent=msg;el.classList.remove('hidden');el.classList.toggle('error',isError)}function can(key){return profile?.role==='admin'||profile?.permissions?.[key]===true}
function renderNav(){ $('nav').innerHTML=menus.filter(([k])=>k==='dashboard'||can(k)).map(([k,t])=>`<button data-page="${k}" class="${currentPage===k?'active':''}">${t}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{currentPage=b.dataset.page;renderNav();renderPage()})}
function field(name,label,type='text',required=true,opts=null){if(opts)return `<div class="field"><label>${label}</label><select name="${name}" ${required?'required':''}>${opts.map(o=>`<option value="${safe(o[0])}">${safe(o[1])}</option>`).join('')}</select></div>`;return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" ${type==='number'?'min="0" step="0.01"':''} ${required?'required':''}></div>`}
function formBox(title,fields,button='সংরক্ষণ'){return `<div class="panel"><h2>${title}</h2><form class="dataForm">${fields.join('')}<div class="actions"><button>${button}</button></div></form></div>`}
async function saveForm(form,coll,extra={}){const fd=new FormData(form),data={...extra};for(const [k,v] of fd.entries())data[k]=v;if(data.amount!==undefined)data.amount=Number(data.amount);if(data.quantity!==undefined)data.quantity=Number(data.quantity);if(data.price!==undefined)data.price=Number(data.price);if(data.costPrice!==undefined)data.costPrice=Number(data.costPrice);if(data.salePrice!==undefined)data.salePrice=Number(data.salePrice);if(data.installments!==undefined)data.installments=Number(data.installments);data.createdAt=serverTimestamp();data.createdBy=currentUser.uid;data.createdByEmail=currentUser.email;await addDoc(collection(db,coll),data);return true}
function bindForms(){document.querySelectorAll('.dataForm').forEach(f=>f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('button[type="submit"],button');b.disabled=true;try{await f._save(f);showNotice('তথ্য Firestore-এ সংরক্ষিত হয়েছে।');await renderPage()}catch(err){showNotice('সংরক্ষণ করা যায়নি: '+err.message,true)}finally{b.disabled=false}})}function showNotice(s,err=false){showMsg($('notice'),s,err)}
async function listTable(coll,cols){let snap=await getDocs(query(collection(db,coll),orderBy('createdAt','desc'),limit(100)));let rows=snap.docs.map(d=>({id:d.id,...d.data()}));return `<div class="panel"><div class="section-head"><h2>${labels[coll]||coll} — সাম্প্রতিক ১০০টি</h2><button class="secondary" onclick="window.print()">প্রিন্ট</button></div><div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th>${safe(c[1])}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${safe(c[2]?c[2](r):r[c[0]]??'—')}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${cols.length}">এখনো কোনো তথ্য নেই</td></tr>`}</tbody></table></div></div>`}
async function dashboard(){const counts={};for(const c of ['members','savingsTransactions','loans','products','refundRequests','collections']){try{const s=await getDocs(query(collection(db,c),limit(500)));counts[c]=s.size}catch{counts[c]='—'}}return `<div class="stats">${[['members','মোট সদস্য'],['savingsTransactions','সঞ্চয় লেনদেন'],['loans','ঋণ রেকর্ড'],['products','পণ্য'],['collections','কিস্তি কালেকশন'],['refundRequests','সঞ্চয় ফেরত আবেদন']].map(([k,t])=>`<div class="stat"><span>${t}</span><strong>${counts[k]}</strong></div>`).join('')}</div><div class="panel"><h2>কাজের নির্দেশনা</h2><p>প্রথমে সদস্য ভর্তি করুন। এরপর সঞ্চয় হিসাব, সঞ্চয় জমা, ঋণ ও পণ্যের তথ্য যোগ করুন।</p><p class="small">এই প্রাথমিক সংস্করণে মেনু ও রেকর্ড সংরক্ষণের ভিত্তি রয়েছে। পূর্ণাঙ্গ ব্যালেন্স গণনা, স্টক সমন্বয়, কিস্তির স্বয়ংক্রিয় সময়সূচি, পাসবই এবং অনুমোদন-পরবর্তী হিসাবের লজিক পরের ধাপে যোগ ও পরীক্ষা করতে হবে।</p></div>`}
async function renderPage(){const v=$('view');v.innerHTML='<div class="panel">লোড হচ্ছে…</div>';try{let html='';switch(currentPage){case'dashboard':html=await dashboard();break;
case'members':html=formBox('নতুন সদস্য ভর্তি',[field('memberNo','সদস্য নম্বর'),field('name','সদস্যের নাম'),field('phone','মোবাইল','tel'),field('village','গ্রাম'),field('address','ঠিকানা','text',false),field('joinDate','ভর্তির তারিখ','date')])+await listTable('members',[['memberNo','সদস্য নম্বর'],['name','নাম'],['phone','মোবাইল'],['village','গ্রাম'],['joinDate','ভর্তির তারিখ']]);window.pendingSaveHandler=f=>saveForm(f,'members',{status:'active'});break;
case'passbook':html=`<div class="panel"><h2>সদস্য পাসবই</h2><p>সদস্যের নম্বর বা নাম দিয়ে খোঁজার পূর্ণ পাসবই পরবর্তী ধাপে যুক্ত হবে। আপাতত লেনদেনের রেকর্ড দেখুন।</p></div>`+await listTable('savingsTransactions',[['memberNo','সদস্য নম্বর'],['memberName','সদস্যের নাম'],['type','ধরন'],['amount','পরিমাণ',r=>money(r.amount)],['date','তারিখ'],['status','অবস্থা']]);break;
case'savingsAccount':html=formBox('নতুন সঞ্চয় হিসাব',[field('memberNo','সদস্য নম্বর'),field('memberName','সদস্যের নাম'),field('openedDate','হিসাব খোলার তারিখ','date'),field('note','মন্তব্য','text',false)])+await listTable('savingsAccounts',[['memberNo','সদস্য নম্বর'],['memberName','সদস্যের নাম'],['openedDate','খোলার তারিখ'],['note','মন্তব্য']]);window.pendingSaveHandler=f=>saveForm(f,'savingsAccounts',{status:'active'});break;
case'deposit':html=formBox('সঞ্চয় জমা',[field('memberNo','সদস্য নম্বর'),field('memberName','সদস্যের নাম'),field('amount','জমার পরিমাণ','number'),field('date','জমার তারিখ','date'),field('receiptNo','রসিদ নম্বর'),field('note','মন্তব্য','text',false)])+await listTable('savingsTransactions',[['memberNo','সদস্য নম্বর'],['memberName','নাম'],['type','ধরন'],['amount','পরিমাণ',r=>money(r.amount)],['date','তারিখ'],['receiptNo','রসিদ']]);window.pendingSaveHandler=f=>saveForm(f,'savingsTransactions',{type:'deposit',status:'approved'});break;
case'refund':html=formBox(profile.role==='admin'?'সঞ্চয় ফেরত — Admin সরাসরি দিতে পারবেন':'সঞ্চয় ফেরতের আবেদন',[field('memberNo','সদস্য নম্বর'),field('memberName','সদস্যের নাম'),field('amount','ফেরতের পরিমাণ','number'),field('date','তারিখ','date'),field('reason','ফেরতের কারণ'),field('receiptNo','রসিদ নম্বর','text',false)])+await listTable('refundRequests',[['memberNo','সদস্য নম্বর'],['memberName','নাম'],['amount','পরিমাণ',r=>money(r.amount)],['date','তারিখ'],['status','অবস্থা'],['reason','কারণ']]);window.pendingSaveHandler=f=>saveForm(f,profile.role==='admin'?'savingsTransactions':'refundRequests',profile.role==='admin'?{type:'refund',status:'approved'}:{type:'refund',status:'pending'});break;
case'products':html=formBox('পণ্য যোগ করুন',[field('productCode','পণ্য কোড'),field('name','পণ্যের নাম'),field('costPrice','ক্রয়মূল্য','number'),field('salePrice','বিক্রয়মূল্য','number'),field('quantity','প্রারম্ভিক স্টক','number'),field('details','বিবরণ','text',false)])+await listTable('products',[['productCode','কোড'],['name','পণ্যের নাম'],['costPrice','ক্রয়মূল্য',r=>money(r.costPrice)],['salePrice','বিক্রয়মূল্য',r=>money(r.salePrice)],['quantity','স্টক']]);window.pendingSaveHandler=f=>saveForm(f,'products');break;
case'purchase':html=formBox('পণ্য ক্রয় রেকর্ড',[field('supplier','সরবরাহকারী'),field('productCode','পণ্য কোড'),field('productName','পণ্যের নাম'),field('quantity','পরিমাণ','number'),field('costPrice','প্রতি পণ্যের ক্রয়মূল্য','number'),field('date','ক্রয়ের তারিখ','date'),field('invoiceNo','চালান নম্বর','text',false)])+await listTable('purchases',[['supplier','সরবরাহকারী'],['productCode','পণ্য কোড'],['productName','পণ্য'],['quantity','পরিমাণ'],['costPrice','একক মূল্য',r=>money(r.costPrice)],['date','তারিখ']]);window.pendingSaveHandler=f=>saveForm(f,'purchases',{status:'recorded'});break;
case'sale':html=formBox('পণ্য বিক্রয় রেকর্ড',[field('memberNo','সদস্য নম্বর'),field('memberName','সদস্যের নাম'),field('productCode','পণ্য কোড'),field('productName','পণ্যের নাম'),field('quantity','পরিমাণ','number'),field('price','একক বিক্রয়মূল্য','number'),field('deposit','অগ্রিম জমা','number'),field('installmentType','কিস্তির ধরন','text',true,[['weekly','সাপ্তাহিক'],['monthly','মাসিক']]),field('installments','কিস্তির সংখ্যা','number'),field('date','বিক্রয়ের তারিখ','date')])+await listTable('sales',[['memberNo','সদস্য নম্বর'],['memberName','সদস্য'],['productName','পণ্য'],['quantity','পরিমাণ'],['price','একক মূল্য',r=>money(r.price)],['installmentType','কিস্তি'],['installments','কিস্তির সংখ্যা'],['date','তারিখ']]);window.pendingSaveHandler=f=>{const fd=new FormData(f);const quantity=Number(fd.get('quantity')),price=Number(fd.get('price')),deposit=Number(fd.get('deposit'));return saveForm(f,'sales',{total:quantity*price,balance:Math.max(0,quantity*price-deposit),status:'recorded'})};break;
case'loans':html=formBox('ঋণ বিতরণ',[field('memberNo','সদস্য নম্বর'),field('memberName','সদস্যের নাম'),field('loanType','ঋণের ধরন','text',true,[['cash','নগদ ঋণ'],['product','পণ্য ঋণ']]),field('principal','ঋণের পরিমাণ','number'),field('installmentType','কিস্তির ধরন','text',true,[['weekly','সাপ্তাহিক'],['monthly','মাসিক']]),field('installments','কিস্তির সংখ্যা','number'),field('startDate','শুরুর তারিখ','date'),field('note','মন্তব্য','text',false)])+await listTable('loans',[['memberNo','সদস্য নম্বর'],['memberName','সদস্য'],['loanType','ধরন'],['principal','ঋণের পরিমাণ',r=>money(r.principal)],['installmentType','কিস্তি'],['installments','কিস্তির সংখ্যা'],['status','অবস্থা']]);window.pendingSaveHandler=f=>saveForm(f,'loans',{status:'recorded'});break;
case'collection':html=formBox('কিস্তি কালেকশন',[field('memberNo','সদস্য নম্বর'),field('memberName','সদস্যের নাম'),field('amount','আদায়ের পরিমাণ','number'),field('date','আদায়ের তারিখ','date'),field('paymentFor','কিসের কিস্তি','text',true,[['cashLoan','নগদ ঋণ'],['productSale','পণ্য বিক্রয়'],['productLoan','পণ্য ঋণ']]),field('receiptNo','রসিদ নম্বর'),field('note','মন্তব্য','text',false)])+await listTable('collections',[['memberNo','সদস্য নম্বর'],['memberName','সদস্য'],['amount','আদায়',r=>money(r.amount)],['date','তারিখ'],['paymentFor','ধরন'],['receiptNo','রসিদ']]);window.pendingSaveHandler=f=>saveForm(f,'collections',{status:'recorded'});break;
case'approvals':html=`<div class="panel"><h2>সঞ্চয় ফেরতের অপেক্ষমাণ আবেদন</h2><p class="small">এই সংস্করণে আবেদন তালিকা দেখা যাবে; নিরাপদে অনুমোদন/প্রত্যাখ্যান ও ব্যালেন্স যাচাইয়ের লজিক পরবর্তী ধাপে যোগ করতে হবে।</p></div>`+await listTable('refundRequests',[['memberNo','সদস্য নম্বর'],['memberName','নাম'],['amount','পরিমাণ',r=>money(r.amount)],['date','তারিখ'],['status','অবস্থা'],['reason','কারণ']]);break;

v.innerHTML=html;const f=v.querySelector('.dataForm');if(f&&typeof window.pendingSaveHandler==='function'){f._save=window.pendingSaveHandler;}window.pendingSaveHandler=null;bindForms();}catch(err){v.innerHTML=`<div class="panel"><h2>তথ্য লোড করা যায়নি</h2><p>${safe(err.message)}</p><p class="small">Firestore Rules, লগইন ও users/{uid} প্রোফাইল যাচাই করুন।</p></div>`}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);$('loginMsg').classList.add('hidden')}catch(err){showMsg($('loginMsg'),'লগইন হয়নি: '+err.message,true)}});$('logout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async user=>{currentUser=user;if(!user){profile=null;$('loginBox').classList.remove('hidden');$('appBox').classList.add('hidden');$('userbar').classList.add('hidden');return}try{const snap=await getDoc(doc(db,'users',user.uid));if(!snap.exists())throw new Error('আপনার users/'+user.uid+' প্রোফাইল নেই। Firebase Console → Firestore → users-এ Admin প্রোফাইল তৈরি করুন (README দেখুন)।');profile=snap.data();if(!['admin','staff'].includes(profile.role))throw new Error('আপনার role admin বা staff নয়।');$('loginBox').classList.add('hidden');$('appBox').classList.remove('hidden');$('userbar').classList.remove('hidden');$('who').textContent=(profile.name||user.email)+' · '+profile.role;renderNav();await renderPage()}catch(err){await signOut(auth);showMsg($('loginMsg'),err.message,true);$('loginBox').classList.remove('hidden')}});
</script>
