name: Check Swapnochura SMS Functions

on:
  workflow_dispatch:
  schedule:
    # 09:00 Bangladesh time = 03:00 UTC
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: swapnochura-sms-reminders
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify required files
        run: |
          test -f firebase.json
          test -f functions/index.js
          test -f functions/github-runner.js
          test -f functions/package.json

      - name: Install dependencies
        working-directory: functions
        run: npm install --no-package-lock

      - name: Check JavaScript syntax
        working-directory: functions
        run: |
          node --check index.js
          node --check github-runner.js

      - name: Test installment date calculations
        working-directory: functions
        run: |
          node <<'NODE'
          const cases = [
            ['2026-01-31', 1, '2026-02-28'],
            ['2024-01-31', 1, '2024-02-29'],
            ['2026-01-31', 2, '2026-03-31'],
            ['2026-05-15', 1, '2026-06-15'],
            ['2026-03-31', 1, '2026-04-30']
          ];

          function monthlyDueDate(start, offset) {
            const [y, m, d] = start.split('-').map(Number);
            const index = m - 1 + offset;
            const year = y + Math.floor(index / 12);
            const month = ((index % 12) + 12) % 12;
            const last = new Date(Date.UTC(year, month + 1, 0)).getUTCDate();
            return [
              year,
              String(month + 1).padStart(2, '0'),
              String(Math.min(d, last)).padStart(2, '0')
            ].join('-');
          }

          for (const [start, offset, expected] of cases) {
            const actual = monthlyDueDate(start, offset);
            if (actual !== expected) {
              throw new Error(`${start}: expected ${expected}, got ${actual}`);
            }
            console.log(`PASS: ${start} -> ${actual}`);
          }
          console.log('All date tests passed.');
          NODE

      - name: Run installment SMS reminders
        working-directory: functions
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          SMS_BD_API_KEY: ${{ secrets.SMS_BD_API_KEY }}
          SMS_ALERTS_ENABLED: ${{ vars.SMS_ALERTS_ENABLED }}
        run: node github-runner.js
