
name: Swapnochura Installment SMS Reminder

on:
  workflow_dispatch:
  schedule:
    # বাংলাদেশ সময় সকাল ৯টা
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: swapnochura-sms-reminders
  cancel-in-progress: false

jobs:
  reminder:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify required files
        run: |
          test -f firebase.json
          test -f functions/package.json
          test -f functions/github-runner.js

      - name: Install dependencies
        working-directory: functions
        run: npm install --no-package-lock

      - name: Check JavaScript syntax
        working-directory: functions
        run: node --check github-runner.js

      - name: Run installment SMS reminders
        working-directory: functions
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          SMS_BD_API_KEY: ${{ secrets.SMS_BD_API_KEY }}
          SMS_ALERTS_ENABLED: ${{ vars.SMS_ALERTS_ENABLED }}
        run: node github-runner.js
